# NoteFusion backend stack — one command brings up the whole server side:
#   docker compose up --build
# Then hit the API at http://localhost:5080 (Swagger at /swagger) with the mobile
# app pointed at http://10.0.2.2:5080 (emulator) or your machine's LAN IP (device).
#
# Three services, one job each:
#   api       C# .NET 10 Web API   — the only gateway the clients talk to
#   db        PostgreSQL 16         — EF Core persistence (migrations auto-run at startup)
#   transcriber Python FastAPI      — internal ML worker, reached ONLY by the api service

name: notefusion

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notefusion
      POSTGRES_USER: notefusion
      # Dev-only credential. Override in production (e.g. via .env, which is gitignored).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notefusion_dev}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # this machine only; exposed for local tooling (pgAdmin, dotnet ef); not needed by clients
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notefusion -d notefusion"]
      interval: 5s
      timeout: 3s
      retries: 10

  transcriber:
    build:
      context: ./server
    environment:
      NF_MAX_CLIP_SECONDS: ${NF_MAX_CLIP_SECONDS:-180}
      NF_MAX_UPLOAD_BYTES: ${NF_MAX_UPLOAD_BYTES:-26214400}
      NF_JOB_TTL_SECONDS: ${NF_JOB_TTL_SECONDS:-900}
      NF_API_KEY: ${TRANSCRIPTION_API_KEY:-dev_transcription_secret}
    ports:
      - "127.0.0.1:8000:8000" # this machine only; exposed for curl/dev; in production, drop this and let the api reach it internally
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s # model load on first boot is slow (CPU ONNX)

  transcriber-verify:
    build:
      context: ./server
    command: >
      python -c "from basic_pitch.inference import Model;
      from basic_pitch import ICASSP_2022_MODEL_PATH;
      Model(ICASSP_2022_MODEL_PATH);
      print('basic_pitch_model_load: OK')"

  api:
    build:
      context: .
      dockerfile: src/NoteFusion.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # EF Core database — the container name resolves via the compose network.
      Database__Host: db
      Database__Port: "5432"
      Database__Database: notefusion
      Database__Username: notefusion
      Database__Password: ${POSTGRES_PASSWORD:-notefusion_dev}
      Database__ApplyMigrationsAtStartup: "true"
      # The internal ML worker — the only outbound call the API makes.
      TranscriptionApi__BaseUrl: http://transcriber:8000
      TranscriptionApi__ApiKey: ${TRANSCRIPTION_API_KEY:-dev_transcription_secret}
      # Stable signing key across restarts. Generate one for real deploys:
      #   openssl genpkey -algorithm RSA -out jwt-key.pem -pkeyopt rsa_keygen_bits:2048
      # then mount/secret it. When unset the API generates an ephemeral key (dev only).
      # Jwt__PrivateKeyPem:
      Seed__AdminFullName: NoteFusion Admin
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL:-admin@notefusion.app}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-ChangeMe!123}
      Push__UseExpo: "false"
      # This stack has no TLS anywhere — the api binds plain http on 8080 and nothing terminates
      # https in front of it — so the production default of redirecting http to https would send
      # every request to a port nobody is listening on. Heroku, which does have a TLS router, leaves
      # this unset and gets the redirect.
      Security__RequireHttps: "false"
      # The header at the top of this file sends you to /swagger, so say so: it is opt-in outside
      # Development now, because it documents every admin route to anyone who loads it.
      Swagger__Enabled: "true"
      # Nothing sits between a caller and this container, so there is no forwarded chain to trust and
      # rate limiting partitions on the socket peer instead. Left at Heroku's 1 and the whole stack
      # would share one bucket, because every request arrives from the same compose-network address.
      RateLimit__TrustedProxyHops: "0"
      # Origin allowed to call the admin analytics routes from a browser. The localhost pair is only
      # added automatically in Development, and this service runs Production, so the dashboard has to
      # be named explicitly; add more as __1, __2, …
      Cors__AllowedOrigins__0: ${ADMIN_DASHBOARD_ORIGIN:-http://localhost:3000}
      # Admin-console passkeys against the local console (Production would default to notefusion.studio).
      Passkeys__RpId: localhost
      Passkeys__Origins: ${ADMIN_DASHBOARD_ORIGIN:-http://localhost:3000}
      # The blog (docs/BLOG.md): drafting needs a Gemini key, rebuilding the site on publish a GitHub token.
      # Both off unless set in .env; the twice-weekly drafts stay off locally.
      Gemini__ApiKey: ${GEMINI_API_KEY:-}
      GitHub__Token: ${GH_DEPLOY_TOKEN:-}
      Blog__AutoDraftEnabled: "false"
      # Profile photos go to Cloudflare R2 only when all of these are set in .env; otherwise uploads
      # are refused with a friendly message. UseR2 must default: an empty bool stops startup.
      R2__UseR2: ${R2__UseR2:-false}
      R2__AccountId: ${R2__AccountId:-}
      R2__AccessKeyId: ${R2__AccessKeyId:-}
      R2__SecretAccessKey: ${R2__SecretAccessKey:-}
      R2__BucketName: ${R2__BucketName:-}
      R2__PublicBaseUrl: ${R2__PublicBaseUrl:-}
    ports:
      - "127.0.0.1:5080:8080" # this machine only: the stack's passwords are public defaults
    depends_on:
      db:
        condition: service_healthy
      transcriber:
        condition: service_healthy
    # No container healthcheck: the aspnet runtime image ships no curl/wget, and nothing
    # in this stack gates on the api being healthy. Both probes are anonymous, for an
    # external orchestrator/load balancer: /health is liveness (always 200 if the process
    # is up) and /health/ready is readiness (503 when the database or transcriber is
    # unreachable, so a bad deploy is not sent traffic).

volumes:
  db-data:
