name: Mobile development build

# Builds the Expo *development client* (the `development` profile in
# mobile/eas.json: developmentClient + internal distribution) — the build you
# install on a device to run `expo start --dev-client` against.
#
# Manual dispatch only, deliberately. Every run queues a real EAS build against
# the account's build quota, so this must not fire on every push. Native config
# lives in app.json, so a new dev build is only needed when that changes
# (plugins, permissions, softwareKeyboardLayoutMode, icons) — not for ordinary
# JS/TS edits, which reload over the existing client.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        default: android
        options: [android, ios, all]
      profile:
        description: eas.json build profile
        type: choice
        default: development
        options: [development, preview, production]

jobs:
  build:
    name: EAS build (${{ inputs.platform }} / ${{ inputs.profile }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      # Fail with a readable message instead of a confusing eas-cli auth error.
      # Checked in the shell, not in `if:` — the secrets context is not
      # available to step-level conditions.
      - name: Check EXPO_TOKEN is set
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is not set. Create a token at https://expo.dev/settings/access-tokens and add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Cheap gate before the expensive step: a type error would otherwise only
      # surface ~20 minutes into a remote build.
      - name: Type-check
        run: npm run lint

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # --no-wait returns once the build is queued: the run stays short and the
      # build page URL is printed in the log. Track progress on expo.dev.
      #
      # --non-interactive requires credentials to already exist on EAS. If this
      # is the first build for a platform, run `eas build` once locally so EAS
      # can generate and store the keystore (Android) or provisioning profile
      # (iOS); afterwards CI reuses them.
      - name: Queue build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform ${{ inputs.platform }} \
            --profile ${{ inputs.profile }} \
            --non-interactive \
            --no-wait
