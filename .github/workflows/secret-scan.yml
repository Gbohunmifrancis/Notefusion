name: Secret scan

# gitleaks over the code (.gitleaks.toml): on every pull request, on main, and as the first job of every deploy
# (deploy.yml, deploy-web.yml, deploy-admin.yml call this workflow and wait for it), so a key that reaches the code
# fails the check and stops the deploy instead of shipping. Two passes: the files as they are, and the commits
# being added (a key committed and then deleted in the same push is still in the history everyone can read).
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  gitleaks:
    name: No secrets in the code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Pinned by digest: the scanner that guards every deploy changes only when this line does.
      GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get gitleaks
        run: |
          docker pull -q "$GITLEAKS_IMAGE" >/dev/null
          docker create --name gitleaks "$GITLEAKS_IMAGE" >/dev/null
          docker cp gitleaks:/usr/bin/gitleaks "$RUNNER_TEMP/gitleaks"
          docker rm gitleaks >/dev/null
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan the files
        run: '"$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --redact --no-banner --exit-code 1'

      - name: Scan the commits being added
        env:
          # A pull request's own commits; a push's new commits. A run with neither (a manual or scheduled deploy)
          # has only the files to check, which the step above did.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No earlier commit to compare with; the files were scanned above."
            exit 0
          fi
          echo "Commits $BASE..$HEAD: $(git rev-list --count "$BASE..$HEAD")"
          "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --log-opts="$BASE..$HEAD" --redact --no-banner --exit-code 1
