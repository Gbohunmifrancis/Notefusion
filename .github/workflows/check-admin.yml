name: Check Admin User

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: E2E Tests
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker exec notefusion-prod-db-1 psql -U notefusion -d notefusion -c "SELECT \"Id\", \"Email\", \"Role\" FROM users;"
