name: E2E Test Debug

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Debug Env
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Container ENV:"
            docker exec notefusion-prod-api-1 env | grep -i paystack
            echo "---"
            cat /opt/notefusion/.env | grep -i paystack
