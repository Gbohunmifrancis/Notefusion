name: Deploy to EC2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "server/**"
      - "Dockerfile"
      - "docker-compose.prod.yml"
      - "NoteFusion.slnx"
      - "Directory.Build.props"
      - ".github/workflows/deploy.yml"

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  API_IMAGE_NAME: ghcr.io/gbohunmifrancis/notefusion-api
  TRANSCRIBER_IMAGE_NAME: ghcr.io/gbohunmifrancis/notefusion-transcriber

jobs:
  build-and-push:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.API_IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/NoteFusion.Api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Extract metadata for Transcriber
        id: meta-transcriber
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.TRANSCRIBER_IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Transcriber
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-transcriber.outputs.tags }}
          labels: ${{ steps.meta-transcriber.outputs.labels }}
          cache-from: type=gha,scope=transcriber
          cache-to: type=gha,mode=max,scope=transcriber

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose.prod.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/opt/notefusion/"

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          API_IMAGE: ${{ env.API_IMAGE_NAME }}:sha-${{ github.sha }}
          TRANSCRIBER_IMAGE: ${{ env.TRANSCRIBER_IMAGE_NAME }}:sha-${{ github.sha }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          TRANSCRIPTION_API_KEY: ${{ secrets.TRANSCRIPTION_API_KEY }}
          JWT_ISSUER: ${{ secrets.JWT_ISSUER }}
          JWT_AUDIENCE: ${{ secrets.JWT_AUDIENCE }}
          JWT_PRIVATE_KEY_PEM: ${{ secrets.JWT_PRIVATE_KEY_PEM }}
          SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_REGION: ${{ secrets.S3_REGION }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: API_IMAGE,TRANSCRIBER_IMAGE,POSTGRES_PASSWORD,TRANSCRIPTION_API_KEY,JWT_ISSUER,JWT_AUDIENCE,JWT_PRIVATE_KEY_PEM,SEED_ADMIN_EMAIL,SEED_ADMIN_PASSWORD,DOMAIN_NAME,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,S3_BUCKET,S3_REGION,GHCR_TOKEN,GHCR_USER
          script: |
            set -euo pipefail
            cd /opt/notefusion

            echo "─── Authenticating with GHCR ───"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            echo "─── Writing JWT private key ───"
            printf '%s\n' "$JWT_PRIVATE_KEY_PEM" > jwt_private_key.pem
            chown 1000:1000 jwt_private_key.pem
            chmod 600 jwt_private_key.pem

            echo "─── Writing .env ───"
            printf 'POSTGRES_PASSWORD="%s"\nTRANSCRIPTION_API_KEY="%s"\nJWT_ISSUER="%s"\nJWT_AUDIENCE="%s"\nSEED_ADMIN_EMAIL="%s"\nSEED_ADMIN_PASSWORD="%s"\nDOMAIN_NAME="%s"\nAWS_ACCESS_KEY_ID="%s"\nAWS_SECRET_ACCESS_KEY="%s"\nS3_BUCKET="%s"\nS3_REGION="%s"\nAPI_IMAGE="%s"\nTRANSCRIBER_IMAGE="%s"\n' \
              "$POSTGRES_PASSWORD" "$TRANSCRIPTION_API_KEY" "$JWT_ISSUER" "$JWT_AUDIENCE" "$SEED_ADMIN_EMAIL" "$SEED_ADMIN_PASSWORD" "$DOMAIN_NAME" "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" "$S3_BUCKET" "$S3_REGION" "$API_IMAGE" "$TRANSCRIBER_IMAGE" > .env
            chmod 600 .env

            echo "─── Pulling new images ───"
            docker compose -f docker-compose.prod.yml pull api transcriber

            echo "─── Starting / swapping containers ───"
            docker compose -f docker-compose.prod.yml up -d --no-deps transcriber
            docker compose -f docker-compose.prod.yml up -d --no-deps db
            docker compose -f docker-compose.prod.yml up -d --no-deps db-backup
            docker compose -f docker-compose.prod.yml up -d --no-deps api
            docker compose -f docker-compose.prod.yml up -d --no-deps caddy

            echo "─── Pruning dangling images ───"
            docker image prune -f

            echo ""
            echo "🚀  Deploy complete — ${API_IMAGE}"
