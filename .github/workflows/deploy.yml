name: Deploy to EC2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "server/**"
      - "Dockerfile"
      - "docker-compose.prod.yml"
      - "ops/backup/**"
      - "NoteFusion.slnx"
      - "Directory.Build.props"
      - ".github/workflows/deploy.yml"
  # Weekly, at a quiet hour (Monday 03:23 UTC, 04:23 in Lagos): rebuild and redeploy main so the
  # worker image's yt-dlp never goes stale between pushes (YouTube breaks old releases every few
  # weeks; the worker also updates itself daily, this keeps the baked copy close behind). Both
  # images are built: main's newest commit may have touched only the website, so no image may be
  # tagged with it yet. A scheduled run always runs on main's tip, so the outdated-commit guard
  # below has nothing to refuse.
  schedule:
    - cron: "23 3 * * 1"

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  API_IMAGE_NAME: ghcr.io/gbohunmifrancis/notefusion-api
  TRANSCRIBER_IMAGE_NAME: ghcr.io/gbohunmifrancis/notefusion-transcriber
  BACKUP_IMAGE_NAME: ghcr.io/gbohunmifrancis/notefusion-backup

jobs:
  build-and-push:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Re-running an old push run deploys that old commit. The database may already hold rows a
      # newer build wrote (e.g. a plan interval the old code cannot read), so an old API crashes on
      # start. Only the tip of main ships on a push or a re-run; roll back with "Run workflow" instead.
      - name: Refuse to deploy an outdated commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          head=$(git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" refs/heads/main | cut -f1)
          if [ "$head" != "${{ github.sha }}" ]; then
            echo "::error::This run is for ${{ github.sha }}, but main is now at $head. Re-running an old deploy would roll production back. Use 'Run workflow' on main instead."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.API_IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/NoteFusion.Api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Extract metadata for Transcriber
        id: meta-transcriber
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.TRANSCRIBER_IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Transcriber
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-transcriber.outputs.tags }}
          labels: ${{ steps.meta-transcriber.outputs.labels }}
          cache-from: type=gha,scope=transcriber
          cache-to: type=gha,mode=max,scope=transcriber
          # A new value every run re-runs the Dockerfile's yt-dlp layer (and only that), so every
          # build ships the newest yt-dlp instead of whatever the layer cache held.
          build-args: |
            YTDLP_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}

      # The backup service (ops/backup, docs/BACKUP_AND_MIGRATION.md). Every tool in it is pinned by
      # checksum or commit; the weekly restore drill pulls the "latest" tag.
      - name: Extract metadata for Backup
        id: meta-backup
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKUP_IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Backup
        uses: docker/build-push-action@v6
        with:
          context: ops/backup
          file: ops/backup/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-backup.outputs.tags }}
          labels: ${{ steps.meta-backup.outputs.labels }}
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose.prod.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # db-role.sql lands at /opt/notefusion/ops/backup/: the backup service's database login.
          source: "docker-compose.prod.yml,ops/backup/db-role.sql"
          target: "/opt/notefusion/"

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          API_IMAGE: ${{ env.API_IMAGE_NAME }}:sha-${{ github.sha }}
          TRANSCRIBER_IMAGE: ${{ env.TRANSCRIBER_IMAGE_NAME }}:sha-${{ github.sha }}
          BACKUP_IMAGE: ${{ env.BACKUP_IMAGE_NAME }}:sha-${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          # ── Core infrastructure ──────────────────────────────────────────────
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
          TRANSCRIPTION_API_KEY: ${{ secrets.TRANSCRIPTION_API_KEY }}
          # ── JWT ──────────────────────────────────────────────────────────────
          JWT_ISSUER: ${{ secrets.JWT_ISSUER }}
          JWT_AUDIENCE: ${{ secrets.JWT_AUDIENCE }}
          JWT_PRIVATE_KEY_PEM: ${{ secrets.JWT_PRIVATE_KEY_PEM }}
          # ── Seed ─────────────────────────────────────────────────────────────
          SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          # ── Email (Resend): RESEND_API_KEY alone is enough; the rest are optional overrides ──
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND__APIKEY: ${{ secrets.RESEND__APIKEY }}
          RESEND__FROM: ${{ secrets.RESEND__FROM }}
          EMAIL__FROMADDRESS: ${{ secrets.EMAIL__FROMADDRESS }}
          EMAIL__ASSETBASEURL: ${{ secrets.EMAIL__ASSETBASEURL }}
          EMAIL__USERESEND: ${{ secrets.EMAIL__USERESEND }}
          EMAIL__DAILYLIMIT: ${{ vars.EMAIL__DAILYLIMIT || secrets.EMAIL__DAILYLIMIT }}
          EMAIL__WEEKLYLIMIT: ${{ vars.EMAIL__WEEKLYLIMIT || secrets.EMAIL__WEEKLYLIMIT }}
          EMAIL__MONTHLYLIMIT: ${{ vars.EMAIL__MONTHLYLIMIT || secrets.EMAIL__MONTHLYLIMIT }}
          EMAIL__OPTIONALSHARE: ${{ vars.EMAIL__OPTIONALSHARE || secrets.EMAIL__OPTIONALSHARE }}
          # ── Google OAuth ──────────────────────────────────────────────────────
          GOOGLE__CLIENTID: ${{ secrets.GOOGLE__CLIENTID }}
          # ── Billing ───────────────────────────────────────────────────────────
          BILLING__DEFAULTPROVIDER: ${{ secrets.BILLING__DEFAULTPROVIDER }}
          BILLING__CHECKOUTCALLBACKURL: ${{ secrets.BILLING__CHECKOUTCALLBACKURL }}
          # ── Bachs ─────────────────────────────────────────────────────────────
          BACHS__BASEURL: ${{ secrets.BACHS__BASEURL }}
          BACHS__SECRETKEY: ${{ secrets.BACHS__SECRETKEY }}
          BACHS__WEBHOOKSECRET: ${{ secrets.BACHS__WEBHOOKSECRET }}
          BACHS__SUPPORTEDCURRENCIES: ${{ secrets.BACHS__SUPPORTEDCURRENCIES }}
          # Catalog products for the USD subscriptions (plan codes pro_monthly_usd / pro_yearly_usd).
          # The older PRO_MONTHLY / PRO_YEARLY secrets still work as a fallback for the same codes.
          BACHS__PRODUCTMAP__PRO_MONTHLY_USD: ${{ secrets.BACHS__PRODUCTMAP__PRO_MONTHLY_USD }}
          BACHS__PRODUCTMAP__PRO_YEARLY_USD: ${{ secrets.BACHS__PRODUCTMAP__PRO_YEARLY_USD }}
          BACHS__PRODUCTMAP__PRO_MONTHLY: ${{ secrets.BACHS__PRODUCTMAP__PRO_MONTHLY }}
          BACHS__PRODUCTMAP__PRO_YEARLY: ${{ secrets.BACHS__PRODUCTMAP__PRO_YEARLY }}
          # ── Paystack ──────────────────────────────────────────────────────────
          PAYSTACK__SECRETKEY: ${{ secrets.PAYSTACK__SECRETKEY }}
          PAYSTACK__BASEURL: ${{ secrets.PAYSTACK__BASEURL }}
          PAYSTACK__SUPPORTEDCURRENCIES: ${{ secrets.PAYSTACK__SUPPORTEDCURRENCIES }}
          PAYSTACK__WEBHOOKSECRET: ${{ secrets.PAYSTACK__WEBHOOKSECRET }}
          # ── Flutterwave ───────────────────────────────────────────────────────
          FLUTTERWAVE__BASEURL: ${{ secrets.FLUTTERWAVE__BASEURL }}
          # ── Squad ─────────────────────────────────────────────────────────────
          SQUAD__BASEURL: ${{ secrets.SQUAD__BASEURL }}
          # ── Cloudflare R2 ─────────────────────────────────────────────────────
          R2__ACCOUNTID: ${{ secrets.R2__ACCOUNTID }}
          R2__ACCESSKEYID: ${{ secrets.R2__ACCESSKEYID }}
          R2__SECRETACCESSKEY: ${{ secrets.R2__SECRETACCESSKEY }}
          R2__BUCKETNAME: ${{ secrets.R2__BUCKETNAME }}
          R2__PUBLICBASEURL: ${{ secrets.R2__PUBLICBASEURL }}
          R2__USER2: ${{ secrets.R2__USER2 }}
          # ── Push notifications ────────────────────────────────────────────────
          PUSH__USEEXPO: ${{ secrets.PUSH__USEEXPO }}
          # Web push (the web app's notifications with the tab closed): all optional. Without a pair the VAPID
          # keys are derived from the JWT signing key; WEBPUSH_ENABLED=false turns it off.
          WEBPUSH_ENABLED: ${{ vars.WEBPUSH_ENABLED || secrets.WEBPUSH_ENABLED }}
          WEBPUSH_PUBLIC_KEY: ${{ secrets.WEBPUSH_PUBLIC_KEY }}
          WEBPUSH_PRIVATE_KEY: ${{ secrets.WEBPUSH_PRIVATE_KEY }}
          WEBPUSH_SUBJECT: ${{ vars.WEBPUSH_SUBJECT || secrets.WEBPUSH_SUBJECT }}
          # ── Auth ──────────────────────────────────────────────────────────────
          AUTH__RESETPASSWORDURL: ${{ secrets.AUTH__RESETPASSWORDURL }}
          # Admin-console passkeys: optional repository variables; unset = notefusion.studio and the console.
          PASSKEYS_RP_ID: ${{ vars.PASSKEYS_RP_ID }}
          PASSKEYS_ORIGINS: ${{ vars.PASSKEYS_ORIGINS }}
          # ── Founder outreach (docs/DEPLOYMENT.md, "Outreach"): all optional; a repository variable or a
          # secret overrides the production default (on, from Francis, replies to hello@notefusion.studio) ──
          OUTREACH_ENABLED: ${{ vars.OUTREACH_ENABLED || secrets.OUTREACH_ENABLED }}
          OUTREACH_FOUNDER_NAME: ${{ vars.OUTREACH_FOUNDER_NAME || secrets.OUTREACH_FOUNDER_NAME }}
          OUTREACH_REPLY_TO: ${{ vars.OUTREACH_REPLY_TO || secrets.OUTREACH_REPLY_TO }}
          OUTREACH_BATCH_SIZE: ${{ vars.OUTREACH_BATCH_SIZE || secrets.OUTREACH_BATCH_SIZE }}
          OUTREACH_INTERVAL_MINUTES: ${{ vars.OUTREACH_INTERVAL_MINUTES || secrets.OUTREACH_INTERVAL_MINUTES }}
          # ── Blog (docs/BLOG.md): Gemini drafts in the admin console, and site rebuilds on publish ──
          # GEMINI_API_KEY is the same secret the old PR drafter used. GH_DEPLOY_TOKEN is a fine-grained
          # token with Actions read & write on this repository (it runs deploy-web.yml). Both optional:
          # without them drafting, or rebuilding the site on publish, is off and the console says so.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || secrets.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS }}
          GH_DEPLOY_TOKEN: ${{ secrets.GH_DEPLOY_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          BLOG_AUTODRAFT_ENABLED: ${{ vars.BLOG_AUTODRAFT_ENABLED }}
          BLOG_AUTOPUBLISH_DRAFTS: ${{ vars.BLOG_AUTOPUBLISH_DRAFTS }}
          BLOG_AUTODRAFT_DAYS: ${{ vars.BLOG_AUTODRAFT_DAYS }}
          BLOG_AUTODRAFT_TIME_UTC: ${{ vars.BLOG_AUTODRAFT_TIME_UTC }}
          BLOG_AUTODRAFT_COUNT: ${{ vars.BLOG_AUTODRAFT_COUNT }}
          # ── YouTube ───────────────────────────────────────────────────────────
          # Netscape cookies.txt from a signed-in browser (see docs/DEPLOYMENT.md, "YouTube").
          YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
          # Optional, off when unset: a residential proxy URL (http://user:pass@host:port) that
          # yt-dlp falls back to after YouTube refuses this server (docs/DEPLOYMENT.md).
          YTDLP_PROXY: ${{ secrets.YTDLP_PROXY }}
          # ── Dozzle (/logs) sign-in, optional: both or neither (docs/DEPLOYMENT.md, "Logs") ──
          DOZZLE_USER: ${{ secrets.DOZZLE_USER }}
          DOZZLE_PASSWORD_HASH: ${{ secrets.DOZZLE_PASSWORD_HASH }}
          # ── Backups (docs/BACKUP_AND_MIGRATION.md): a bucket of their own (not the photo bucket) with a
          # token scoped to it. Without all five the backup service logs what is missing and idles. ──
          BACKUP_S3_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT || secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET || secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_REGION: ${{ vars.BACKUP_S3_REGION }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
          # Optional: a second destination at another provider (an rclone connection string).
          BACKUP_MIRROR: ${{ secrets.BACKUP_MIRROR }}
          # Only after restoring from a logical dump (a new cluster): a fresh WAL-G prefix, e.g. s3://notefusion-backups/wal-g-2027-01.
          BACKUP_WALG_PREFIX: ${{ vars.BACKUP_WALG_PREFIX }}
          # A planned move (docs/BACKUP_AND_MIGRATION.md, "Moving to another cloud"): true refuses writes.
          MAINTENANCE_READ_ONLY: ${{ vars.MAINTENANCE_READ_ONLY }}
          # ── Error reports (docs/DEPLOYMENT.md, "Error reports"): one Sentry project each; blank = off ──
          SENTRY_DSN_API: ${{ vars.SENTRY_DSN_API || secrets.SENTRY_DSN_API }}
          SENTRY_DSN_WORKER: ${{ vars.SENTRY_DSN_WORKER || secrets.SENTRY_DSN_WORKER }}
          SENTRY_RELEASE: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: >-
            API_IMAGE,TRANSCRIBER_IMAGE,GHCR_TOKEN,GHCR_USER,
            POSTGRES_PASSWORD,DOMAIN_NAME,TRANSCRIPTION_API_KEY,
            JWT_ISSUER,JWT_AUDIENCE,JWT_PRIVATE_KEY_PEM,
            SEED_ADMIN_EMAIL,SEED_ADMIN_PASSWORD,
            RESEND_API_KEY,RESEND__APIKEY,RESEND__FROM,EMAIL__FROMADDRESS,EMAIL__ASSETBASEURL,EMAIL__USERESEND,
            EMAIL__DAILYLIMIT,EMAIL__WEEKLYLIMIT,EMAIL__MONTHLYLIMIT,EMAIL__OPTIONALSHARE,
            GOOGLE__CLIENTID,
            BILLING__DEFAULTPROVIDER,BILLING__CHECKOUTCALLBACKURL,
            BACHS__BASEURL,BACHS__SECRETKEY,BACHS__WEBHOOKSECRET,BACHS__SUPPORTEDCURRENCIES,
            BACHS__PRODUCTMAP__PRO_MONTHLY_USD,BACHS__PRODUCTMAP__PRO_YEARLY_USD,BACHS__PRODUCTMAP__PRO_MONTHLY,BACHS__PRODUCTMAP__PRO_YEARLY,
            PAYSTACK__SECRETKEY,PAYSTACK__BASEURL,PAYSTACK__SUPPORTEDCURRENCIES,PAYSTACK__WEBHOOKSECRET,
            FLUTTERWAVE__BASEURL,SQUAD__BASEURL,
            R2__ACCOUNTID,R2__ACCESSKEYID,R2__SECRETACCESSKEY,R2__BUCKETNAME,R2__PUBLICBASEURL,R2__USER2,
            PUSH__USEEXPO,AUTH__RESETPASSWORDURL,PASSKEYS_RP_ID,PASSKEYS_ORIGINS,YTDLP_COOKIES,YTDLP_PROXY,
            WEBPUSH_ENABLED,WEBPUSH_PUBLIC_KEY,WEBPUSH_PRIVATE_KEY,WEBPUSH_SUBJECT,
            OUTREACH_ENABLED,OUTREACH_FOUNDER_NAME,OUTREACH_REPLY_TO,OUTREACH_BATCH_SIZE,OUTREACH_INTERVAL_MINUTES,
            GEMINI_API_KEY,GEMINI_MODEL,GEMINI_FALLBACK_MODELS,GH_DEPLOY_TOKEN,GH_REPOSITORY,
            BLOG_AUTODRAFT_ENABLED,BLOG_AUTOPUBLISH_DRAFTS,BLOG_AUTODRAFT_DAYS,BLOG_AUTODRAFT_TIME_UTC,BLOG_AUTODRAFT_COUNT,
            DOZZLE_USER,DOZZLE_PASSWORD_HASH,
            BACKUP_IMAGE,BACKUP_S3_ENDPOINT,BACKUP_S3_BUCKET,BACKUP_S3_REGION,BACKUP_S3_ACCESS_KEY_ID,BACKUP_S3_SECRET_ACCESS_KEY,
            BACKUP_ENCRYPTION_PASSWORD,BACKUP_MIRROR,BACKUP_WALG_PREFIX,MAINTENANCE_READ_ONLY,
            SENTRY_DSN_API,SENTRY_DSN_WORKER,SENTRY_RELEASE
          script: |
            set -euo pipefail
            # The transcriber refuses to start without its key; stop here rather than crash-loop it.
            : "${TRANSCRIPTION_API_KEY:?TRANSCRIPTION_API_KEY secret is not set}"
            cd /opt/notefusion

            echo "─── Disk before deploy ───"
            df -h / || true
            docker system df || true

            echo "─── Cleaning unused Docker resources ───"
            docker container prune -f || true
            docker image prune -af || true
            docker builder prune -af || true
            docker network prune -f || true
            sudo journalctl --vacuum-size=100M 2>/dev/null || true

            echo "─── Authenticating with GHCR ───"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Every secret file below is created owner-only from the first byte: with the default
            # umask (022) a new file is world-readable until its chmod. Nothing later in this
            # script creates a file that needs wider permissions.
            umask 077

            echo "─── Writing JWT private key ───"
            printf '%s\n' "$JWT_PRIVATE_KEY_PEM" > jwt_private_key.pem
            chown 1000:1000 jwt_private_key.pem
            chmod 600 jwt_private_key.pem

            echo "─── YouTube cookies ───"
            # Written only when the secret is set; otherwise the compose file mounts /dev/null
            # and yt-dlp runs anonymously (and YouTube will most likely refuse it).
            if [ -n "$YTDLP_COOKIES" ]; then
              printf '%s\n' "$YTDLP_COOKIES" > ytdlp-cookies.txt
              chmod 600 ytdlp-cookies.txt
              YTDLP_COOKIES_HOST=/opt/notefusion/ytdlp-cookies.txt
            else
              rm -f ytdlp-cookies.txt
              YTDLP_COOKIES_HOST=/dev/null
            fi

            echo "─── Dozzle sign-in ───"
            # With DOZZLE_USER and DOZZLE_PASSWORD_HASH (a bcrypt hash, see docs/DEPLOYMENT.md)
            # /logs asks for a password. Without them, or with a malformed one, it is served as
            # before and this says so: a bad secret must not stop the deploy.
            DOZZLE_AUTH_PROVIDER=none
            DOZZLE_USERS_HOST=/dev/null
            if [ -n "${DOZZLE_USER:-}" ] && [ -n "${DOZZLE_PASSWORD_HASH:-}" ]; then
              if printf '%s' "$DOZZLE_USER" | grep -Eqx '[A-Za-z0-9._-]{1,64}' \
                && printf '%s' "$DOZZLE_PASSWORD_HASH" | grep -Eqx '\$2[aby]\$[0-9]{2}\$[./A-Za-z0-9]{53}'; then
                printf 'users:\n  %s:\n    name: %s\n    email: ""\n    password: '"'"'%s'"'"'\n' \
                  "$DOZZLE_USER" "$DOZZLE_USER" "$DOZZLE_PASSWORD_HASH" > dozzle-users.yml
                chmod 600 dozzle-users.yml
                DOZZLE_AUTH_PROVIDER=simple
                DOZZLE_USERS_HOST=/opt/notefusion/dozzle-users.yml
              else
                echo "::warning::DOZZLE_USER or DOZZLE_PASSWORD_HASH is malformed; /logs stays without a sign-in"
                rm -f dozzle-users.yml
              fi
            else
              echo "::warning::DOZZLE_USER / DOZZLE_PASSWORD_HASH not set; /logs is served without a sign-in"
              rm -f dozzle-users.yml
            fi

            # The backup service's own database login (ops/backup/db-role.sql). Its password is derived from
            # the database password, so there is no extra secret to keep, and the backup container never
            # sees the superuser's.
            BACKUP_DB_PASSWORD=$(printf 'notefusion-backup-role:%s' "$POSTGRES_PASSWORD" | sha256sum | cut -c1-48)

            echo "─── Writing .env ───"
            cat > .env <<EOF
            YTDLP_COOKIES_HOST="${YTDLP_COOKIES_HOST}"
            NF_YTDLP_PROXY="${YTDLP_PROXY:-}"
            DOZZLE_AUTH_PROVIDER="${DOZZLE_AUTH_PROVIDER}"
            DOZZLE_USERS_HOST="${DOZZLE_USERS_HOST}"
            POSTGRES_PASSWORD="${POSTGRES_PASSWORD}"
            TRANSCRIPTION_API_KEY="${TRANSCRIPTION_API_KEY}"
            JWT_ISSUER="${JWT_ISSUER}"
            JWT_AUDIENCE="${JWT_AUDIENCE}"
            SEED_ADMIN_EMAIL="${SEED_ADMIN_EMAIL}"
            SEED_ADMIN_PASSWORD="${SEED_ADMIN_PASSWORD}"
            DOMAIN_NAME="${DOMAIN_NAME}"
            API_IMAGE="${API_IMAGE}"
            TRANSCRIBER_IMAGE="${TRANSCRIBER_IMAGE}"
            Email__ApiKey="${RESEND_API_KEY:-${RESEND__APIKEY}}"
            Resend__From="${RESEND__FROM}"
            Email__FromAddress="${EMAIL__FROMADDRESS}"
            Email__AssetBaseUrl="${EMAIL__ASSETBASEURL}"
            Email__UseResend="${EMAIL__USERESEND}"
            Email__DailyLimit="${EMAIL__DAILYLIMIT}"
            Email__WeeklyLimit="${EMAIL__WEEKLYLIMIT}"
            Email__MonthlyLimit="${EMAIL__MONTHLYLIMIT}"
            Email__OptionalShare="${EMAIL__OPTIONALSHARE}"
            Google__ClientId="${GOOGLE__CLIENTID}"
            Billing__DefaultProvider="${BILLING__DEFAULTPROVIDER}"
            Billing__CheckoutCallbackUrl="${BILLING__CHECKOUTCALLBACKURL}"
            Bachs__BaseUrl="${BACHS__BASEURL}"
            Bachs__SecretKey="${BACHS__SECRETKEY}"
            Bachs__WebhookSecret="${BACHS__WEBHOOKSECRET}"
            Bachs__SupportedCurrencies="${BACHS__SUPPORTEDCURRENCIES:-USD}"
            Bachs__ProductMap__pro_monthly_usd="${BACHS__PRODUCTMAP__PRO_MONTHLY_USD}"
            Bachs__ProductMap__pro_yearly_usd="${BACHS__PRODUCTMAP__PRO_YEARLY_USD}"
            Bachs__ProductMap__pro_monthly="${BACHS__PRODUCTMAP__PRO_MONTHLY}"
            Bachs__ProductMap__pro_yearly="${BACHS__PRODUCTMAP__PRO_YEARLY}"
            Paystack__SecretKey="${PAYSTACK__SECRETKEY}"
            Paystack__BaseUrl="${PAYSTACK__BASEURL:-https://api.paystack.co}"
            Paystack__SupportedCurrencies="${PAYSTACK__SUPPORTEDCURRENCIES:-NGN}"
            Paystack__WebhookSecret="${PAYSTACK__WEBHOOKSECRET}"
            Flutterwave__BaseUrl="${FLUTTERWAVE__BASEURL}"
            Squad__BaseUrl="${SQUAD__BASEURL}"
            R2__AccountId="${R2__ACCOUNTID}"
            R2__AccessKeyId="${R2__ACCESSKEYID}"
            R2__SecretAccessKey="${R2__SECRETACCESSKEY}"
            R2__BucketName="${R2__BUCKETNAME}"
            R2__PublicBaseUrl="${R2__PUBLICBASEURL}"
            R2__UseR2="${R2__USER2}"
            Push__UseExpo="${PUSH__USEEXPO:-true}"
            WebPush__Enabled="${WEBPUSH_ENABLED:-true}"
            WebPush__PublicKey="${WEBPUSH_PUBLIC_KEY}"
            WebPush__PrivateKey="${WEBPUSH_PRIVATE_KEY}"
            WebPush__Subject="${WEBPUSH_SUBJECT:-mailto:hello@notefusion.studio}"
            Auth__ResetPasswordUrl="${AUTH__RESETPASSWORDURL}"
            Passkeys__RpId="${PASSKEYS_RP_ID:-notefusion.studio}"
            Passkeys__Origins="${PASSKEYS_ORIGINS:-https://admin.notefusion.studio}"
            Outreach__Enabled="${OUTREACH_ENABLED:-true}"
            Outreach__FounderName="${OUTREACH_FOUNDER_NAME:-Francis}"
            Outreach__ReplyTo="${OUTREACH_REPLY_TO:-hello@notefusion.studio}"
            Outreach__BatchSize="${OUTREACH_BATCH_SIZE:-5}"
            Outreach__IntervalMinutes="${OUTREACH_INTERVAL_MINUTES:-60}"
            Gemini__ApiKey="${GEMINI_API_KEY}"
            Gemini__Model="${GEMINI_MODEL}"
            Gemini__FallbackModels="${GEMINI_FALLBACK_MODELS}"
            GitHub__Token="${GH_DEPLOY_TOKEN}"
            GitHub__Repo="${GH_REPOSITORY}"
            Blog__AutoDraftEnabled="${BLOG_AUTODRAFT_ENABLED}"
            Blog__AutoPublishDrafts="${BLOG_AUTOPUBLISH_DRAFTS}"
            Blog__AutoDraftDays="${BLOG_AUTODRAFT_DAYS}"
            Blog__AutoDraftTimeUtc="${BLOG_AUTODRAFT_TIME_UTC}"
            Blog__AutoDraftCount="${BLOG_AUTODRAFT_COUNT}"
            Maintenance__ReadOnly="${MAINTENANCE_READ_ONLY:-false}"
            Sentry__Dsn="${SENTRY_DSN_API:-}"
            Sentry__Release="${SENTRY_RELEASE}"
            NF_SENTRY_DSN="${SENTRY_DSN_WORKER:-}"
            NF_SENTRY_RELEASE="${SENTRY_RELEASE}"
            BACKUP_IMAGE="${BACKUP_IMAGE}"
            BACKUP_DB_PASSWORD="${BACKUP_DB_PASSWORD}"
            BACKUP_ENV_NAMES_HOST="/opt/notefusion/env-names.txt"
            BACKUP_S3_ENDPOINT='${BACKUP_S3_ENDPOINT}'
            BACKUP_S3_BUCKET='${BACKUP_S3_BUCKET}'
            BACKUP_S3_REGION='${BACKUP_S3_REGION:-auto}'
            BACKUP_S3_ACCESS_KEY_ID='${BACKUP_S3_ACCESS_KEY_ID}'
            BACKUP_S3_SECRET_ACCESS_KEY='${BACKUP_S3_SECRET_ACCESS_KEY}'
            BACKUP_ENCRYPTION_PASSWORD='${BACKUP_ENCRYPTION_PASSWORD}'
            BACKUP_MIRROR='${BACKUP_MIRROR}'
            BACKUP_WALG_PREFIX='${BACKUP_WALG_PREFIX}'
            EOF
            chmod 600 .env

            # The names of every setting and whether each is set, never a value. The backup service keeps
            # it with the JWT key, so a rebuild elsewhere knows what to carry over.
            while IFS='=' read -r name value; do
              case "$value" in '""' | "''" | '') state=unset ;; *) state=set ;; esac
              printf '%s %s\n' "$name" "$state"
            done < .env > env-names.txt

            # The root volume is 8 GB.  The transcriber image is the biggest thing on it, and
            # since the link-ingest and vocal-isolation work it no longer fits beside its own
            # previous version: the merge of #34 died mid-pull with 1.6 GB free and nothing
            # reclaimable.  So the old transcriber is stopped and its image removed BEFORE the
            # new one is pulled.  Transcription is unavailable for the length of the pull
            # (about a minute); the API, database and site stay up.  If the pull fails the
            # next deploy run pulls again — there is no old image to fall back to, which is
            # the price of a volume this small (growing it to 20 GB removes the problem).
            echo "─── Transcriber: stop, free the old image, pull, start ───"
            docker compose -f docker-compose.prod.yml rm -sf transcriber
            docker image prune -af || true
            df -h / || true
            docker compose -f docker-compose.prod.yml pull transcriber
            docker compose -f docker-compose.prod.yml up -d --no-deps transcriber bgutil-provider

            # The API image is small enough to pull beside the running one, so it swaps
            # without downtime; the prune afterwards drops the version it replaced.

            echo "─── API: pull, swap, prune ───"
            docker compose -f docker-compose.prod.yml pull api
            # The first deploy with WAL archiving restarts the database once (a few seconds): its flags changed.
            docker compose -f docker-compose.prod.yml up -d --no-deps db

            echo "─── Backup database login ───"
            for _ in $(seq 1 30); do
              docker compose -f docker-compose.prod.yml exec -T db pg_isready -U notefusion -d notefusion >/dev/null 2>&1 && break
              sleep 2
            done
            { printf '\\set backup_pw %s\n' "$BACKUP_DB_PASSWORD"; cat ops/backup/db-role.sql; } \
              | docker compose -f docker-compose.prod.yml exec -T db psql -U notefusion -d notefusion -q -v ON_ERROR_STOP=1 \
              || echo "::warning::Could not set up the notefusion_backup login; backups cannot record their runs (docs/BACKUP_AND_MIGRATION.md)"

            docker compose -f docker-compose.prod.yml up -d --no-deps api
            # Dozzle is recreated whenever its image, socket mount or sign-in changed.
            docker compose -f docker-compose.prod.yml up -d --no-deps dozzle
            docker compose -f docker-compose.prod.yml up -d --no-deps caddy

            echo "─── Backups: pull, start ───"
            # Never holds up the deploy: without its settings the service only logs what is missing.
            docker compose -f docker-compose.prod.yml pull backup \
              && docker compose -f docker-compose.prod.yml up -d --no-deps backup \
              || echo "::warning::The backup service did not start; see 'docker compose logs backup'"
            docker image prune -af || true

            echo "─── Disk after deploy ───"
            df -h / || true
            docker system df || true

            echo ""
            echo "🚀  Deploy complete — ${API_IMAGE}"
