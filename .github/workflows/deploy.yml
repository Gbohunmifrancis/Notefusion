name: Deploy to EC2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "server/**"
      - "Dockerfile"
      - "docker-compose.prod.yml"
      - "NoteFusion.slnx"
      - "Directory.Build.props"
      - ".github/workflows/deploy.yml"

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  API_IMAGE_NAME: ghcr.io/gbohunmifrancis/notefusion-api
  TRANSCRIBER_IMAGE_NAME: ghcr.io/gbohunmifrancis/notefusion-transcriber

jobs:
  build-and-push:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.API_IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/NoteFusion.Api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Extract metadata for Transcriber
        id: meta-transcriber
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.TRANSCRIBER_IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Transcriber
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-transcriber.outputs.tags }}
          labels: ${{ steps.meta-transcriber.outputs.labels }}
          cache-from: type=gha,scope=transcriber
          cache-to: type=gha,mode=max,scope=transcriber

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose.prod.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/opt/notefusion/"

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          API_IMAGE: ${{ env.API_IMAGE_NAME }}:sha-${{ github.sha }}
          TRANSCRIBER_IMAGE: ${{ env.TRANSCRIBER_IMAGE_NAME }}:sha-${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          # ── Core infrastructure ──────────────────────────────────────────────
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
          TRANSCRIPTION_API_KEY: ${{ secrets.TRANSCRIPTION_API_KEY }}
          # ── JWT ──────────────────────────────────────────────────────────────
          JWT_ISSUER: ${{ secrets.JWT_ISSUER }}
          JWT_AUDIENCE: ${{ secrets.JWT_AUDIENCE }}
          JWT_PRIVATE_KEY_PEM: ${{ secrets.JWT_PRIVATE_KEY_PEM }}
          # ── Seed ─────────────────────────────────────────────────────────────
          SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          # ── Email (Resend): RESEND_API_KEY alone is enough; the rest are optional overrides ──
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND__APIKEY: ${{ secrets.RESEND__APIKEY }}
          RESEND__FROM: ${{ secrets.RESEND__FROM }}
          EMAIL__FROMADDRESS: ${{ secrets.EMAIL__FROMADDRESS }}
          EMAIL__ASSETBASEURL: ${{ secrets.EMAIL__ASSETBASEURL }}
          EMAIL__USERESEND: ${{ secrets.EMAIL__USERESEND }}
          # ── Google OAuth ──────────────────────────────────────────────────────
          GOOGLE__CLIENTID: ${{ secrets.GOOGLE__CLIENTID }}
          # ── Billing ───────────────────────────────────────────────────────────
          BILLING__DEFAULTPROVIDER: ${{ secrets.BILLING__DEFAULTPROVIDER }}
          BILLING__CHECKOUTCALLBACKURL: ${{ secrets.BILLING__CHECKOUTCALLBACKURL }}
          # ── Bachs ─────────────────────────────────────────────────────────────
          BACHS__BASEURL: ${{ secrets.BACHS__BASEURL }}
          BACHS__SECRETKEY: ${{ secrets.BACHS__SECRETKEY }}
          BACHS__WEBHOOKSECRET: ${{ secrets.BACHS__WEBHOOKSECRET }}
          BACHS__SUPPORTEDCURRENCIES: ${{ secrets.BACHS__SUPPORTEDCURRENCIES }}
          # Catalog products for the USD subscriptions (plan codes pro_monthly_usd / pro_yearly_usd).
          # The older PRO_MONTHLY / PRO_YEARLY secrets still work as a fallback for the same codes.
          BACHS__PRODUCTMAP__PRO_MONTHLY_USD: ${{ secrets.BACHS__PRODUCTMAP__PRO_MONTHLY_USD }}
          BACHS__PRODUCTMAP__PRO_YEARLY_USD: ${{ secrets.BACHS__PRODUCTMAP__PRO_YEARLY_USD }}
          BACHS__PRODUCTMAP__PRO_MONTHLY: ${{ secrets.BACHS__PRODUCTMAP__PRO_MONTHLY }}
          BACHS__PRODUCTMAP__PRO_YEARLY: ${{ secrets.BACHS__PRODUCTMAP__PRO_YEARLY }}
          # ── Paystack ──────────────────────────────────────────────────────────
          PAYSTACK__SECRETKEY: ${{ secrets.PAYSTACK__SECRETKEY }}
          PAYSTACK__BASEURL: ${{ secrets.PAYSTACK__BASEURL }}
          PAYSTACK__SUPPORTEDCURRENCIES: ${{ secrets.PAYSTACK__SUPPORTEDCURRENCIES }}
          PAYSTACK__WEBHOOKSECRET: ${{ secrets.PAYSTACK__WEBHOOKSECRET }}
          # ── Flutterwave ───────────────────────────────────────────────────────
          FLUTTERWAVE__BASEURL: ${{ secrets.FLUTTERWAVE__BASEURL }}
          # ── Squad ─────────────────────────────────────────────────────────────
          SQUAD__BASEURL: ${{ secrets.SQUAD__BASEURL }}
          # ── Cloudflare R2 ─────────────────────────────────────────────────────
          R2__ACCOUNTID: ${{ secrets.R2__ACCOUNTID }}
          R2__ACCESSKEYID: ${{ secrets.R2__ACCESSKEYID }}
          R2__SECRETACCESSKEY: ${{ secrets.R2__SECRETACCESSKEY }}
          R2__BUCKETNAME: ${{ secrets.R2__BUCKETNAME }}
          R2__PUBLICBASEURL: ${{ secrets.R2__PUBLICBASEURL }}
          R2__USER2: ${{ secrets.R2__USER2 }}
          # ── Push notifications ────────────────────────────────────────────────
          PUSH__USEEXPO: ${{ secrets.PUSH__USEEXPO }}
          # ── Auth ──────────────────────────────────────────────────────────────
          AUTH__RESETPASSWORDURL: ${{ secrets.AUTH__RESETPASSWORDURL }}
          # ── YouTube ───────────────────────────────────────────────────────────
          # Netscape cookies.txt from a signed-in browser (see docs/DEPLOYMENT.md, "YouTube").
          YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: >-
            API_IMAGE,TRANSCRIBER_IMAGE,GHCR_TOKEN,GHCR_USER,
            POSTGRES_PASSWORD,DOMAIN_NAME,TRANSCRIPTION_API_KEY,
            JWT_ISSUER,JWT_AUDIENCE,JWT_PRIVATE_KEY_PEM,
            SEED_ADMIN_EMAIL,SEED_ADMIN_PASSWORD,
            RESEND__APIKEY,RESEND__FROM,EMAIL__FROMADDRESS,EMAIL__ASSETBASEURL,EMAIL__USERESEND,
            GOOGLE__CLIENTID,
            BILLING__DEFAULTPROVIDER,BILLING__CHECKOUTCALLBACKURL,
            BACHS__BASEURL,BACHS__SECRETKEY,BACHS__WEBHOOKSECRET,BACHS__SUPPORTEDCURRENCIES,
            BACHS__PRODUCTMAP__PRO_MONTHLY_USD,BACHS__PRODUCTMAP__PRO_YEARLY_USD,BACHS__PRODUCTMAP__PRO_MONTHLY,BACHS__PRODUCTMAP__PRO_YEARLY,
            PAYSTACK__SECRETKEY,PAYSTACK__BASEURL,PAYSTACK__SUPPORTEDCURRENCIES,PAYSTACK__WEBHOOKSECRET,
            FLUTTERWAVE__BASEURL,SQUAD__BASEURL,
            R2__ACCOUNTID,R2__ACCESSKEYID,R2__SECRETACCESSKEY,R2__BUCKETNAME,R2__PUBLICBASEURL,R2__USER2,
            PUSH__USEEXPO,AUTH__RESETPASSWORDURL,YTDLP_COOKIES
          script: |
            set -euo pipefail
            cd /opt/notefusion

            echo "─── Disk before deploy ───"
            df -h / || true
            docker system df || true

            echo "─── Cleaning unused Docker resources ───"
            docker container prune -f || true
            docker image prune -af || true
            docker builder prune -af || true
            docker network prune -f || true
            sudo journalctl --vacuum-size=100M 2>/dev/null || true

            echo "─── Authenticating with GHCR ───"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            echo "─── Writing JWT private key ───"
            printf '%s\n' "$JWT_PRIVATE_KEY_PEM" > jwt_private_key.pem
            chown 1000:1000 jwt_private_key.pem
            chmod 600 jwt_private_key.pem

            echo "─── YouTube cookies ───"
            # Written only when the secret is set; otherwise the compose file mounts /dev/null
            # and yt-dlp runs anonymously (and YouTube will most likely refuse it).
            if [ -n "$YTDLP_COOKIES" ]; then
              printf '%s\n' "$YTDLP_COOKIES" > ytdlp-cookies.txt
              chmod 600 ytdlp-cookies.txt
              YTDLP_COOKIES_HOST=/opt/notefusion/ytdlp-cookies.txt
            else
              rm -f ytdlp-cookies.txt
              YTDLP_COOKIES_HOST=/dev/null
            fi

            echo "─── Writing .env ───"
            cat > .env <<EOF
            YTDLP_COOKIES_HOST="${YTDLP_COOKIES_HOST}"
            POSTGRES_PASSWORD="${POSTGRES_PASSWORD}"
            TRANSCRIPTION_API_KEY="${TRANSCRIPTION_API_KEY}"
            JWT_ISSUER="${JWT_ISSUER}"
            JWT_AUDIENCE="${JWT_AUDIENCE}"
            SEED_ADMIN_EMAIL="${SEED_ADMIN_EMAIL}"
            SEED_ADMIN_PASSWORD="${SEED_ADMIN_PASSWORD}"
            DOMAIN_NAME="${DOMAIN_NAME}"
            API_IMAGE="${API_IMAGE}"
            TRANSCRIBER_IMAGE="${TRANSCRIBER_IMAGE}"
            Email__ApiKey="${RESEND_API_KEY:-${RESEND__APIKEY}}"
            Resend__From="${RESEND__FROM}"
            Email__FromAddress="${EMAIL__FROMADDRESS}"
            Email__AssetBaseUrl="${EMAIL__ASSETBASEURL}"
            Email__UseResend="${EMAIL__USERESEND}"
            Google__ClientId="${GOOGLE__CLIENTID}"
            Billing__DefaultProvider="${BILLING__DEFAULTPROVIDER}"
            Billing__CheckoutCallbackUrl="${BILLING__CHECKOUTCALLBACKURL}"
            Bachs__BaseUrl="${BACHS__BASEURL}"
            Bachs__SecretKey="${BACHS__SECRETKEY}"
            Bachs__WebhookSecret="${BACHS__WEBHOOKSECRET}"
            Bachs__SupportedCurrencies="${BACHS__SUPPORTEDCURRENCIES:-USD}"
            Bachs__ProductMap__pro_monthly_usd="${BACHS__PRODUCTMAP__PRO_MONTHLY_USD}"
            Bachs__ProductMap__pro_yearly_usd="${BACHS__PRODUCTMAP__PRO_YEARLY_USD}"
            Bachs__ProductMap__pro_monthly="${BACHS__PRODUCTMAP__PRO_MONTHLY}"
            Bachs__ProductMap__pro_yearly="${BACHS__PRODUCTMAP__PRO_YEARLY}"
            Paystack__SecretKey="${PAYSTACK__SECRETKEY}"
            Paystack__BaseUrl="${PAYSTACK__BASEURL:-https://api.paystack.co}"
            Paystack__SupportedCurrencies="${PAYSTACK__SUPPORTEDCURRENCIES:-NGN}"
            Paystack__WebhookSecret="${PAYSTACK__WEBHOOKSECRET}"
            Flutterwave__BaseUrl="${FLUTTERWAVE__BASEURL}"
            Squad__BaseUrl="${SQUAD__BASEURL}"
            R2__AccountId="${R2__ACCOUNTID}"
            R2__AccessKeyId="${R2__ACCESSKEYID}"
            R2__SecretAccessKey="${R2__SECRETACCESSKEY}"
            R2__BucketName="${R2__BUCKETNAME}"
            R2__PublicBaseUrl="${R2__PUBLICBASEURL}"
            R2__UseR2="${R2__USER2}"
            Push__UseExpo="${PUSH__USEEXPO}"
            Auth__ResetPasswordUrl="${AUTH__RESETPASSWORDURL}"
            EOF
            chmod 600 .env

            # The root volume is 8 GB.  The transcriber image is the biggest thing on it, and
            # since the link-ingest and vocal-isolation work it no longer fits beside its own
            # previous version: the merge of #34 died mid-pull with 1.6 GB free and nothing
            # reclaimable.  So the old transcriber is stopped and its image removed BEFORE the
            # new one is pulled.  Transcription is unavailable for the length of the pull
            # (about a minute); the API, database and site stay up.  If the pull fails the
            # next deploy run pulls again — there is no old image to fall back to, which is
            # the price of a volume this small (growing it to 20 GB removes the problem).
            echo "─── Transcriber: stop, free the old image, pull, start ───"
            docker compose -f docker-compose.prod.yml rm -sf transcriber
            docker image prune -af || true
            df -h / || true
            docker compose -f docker-compose.prod.yml pull transcriber
            docker compose -f docker-compose.prod.yml up -d --no-deps transcriber bgutil-provider

            # The API image is small enough to pull beside the running one, so it swaps
            # without downtime; the prune afterwards drops the version it replaced.

            echo "─── API: pull, swap, prune ───"
            docker compose -f docker-compose.prod.yml pull api
            docker compose -f docker-compose.prod.yml up -d --no-deps db
            docker compose -f docker-compose.prod.yml up -d --no-deps api
            docker compose -f docker-compose.prod.yml up -d --no-deps caddy
            docker image prune -af || true

            echo "─── Disk after deploy ───"
            df -h / || true
            docker system df || true

            echo ""
            echo "🚀  Deploy complete — ${API_IMAGE}"
