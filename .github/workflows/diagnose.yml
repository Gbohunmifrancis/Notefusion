name: Diagnose EC2

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check logs
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/notefusion
            echo "--- DOCKER PS ---"
            docker ps -a
            echo "--- CURL ASP.NET LOCAL (/api/app/version) ---"
            curl -v -I http://localhost:8080/api/app/version
            echo "--- API LOGS ---"
            docker logs notefusion-prod-api-1 --tail 50
            echo "--- CADDY LOGS ---"
            docker logs notefusion-prod-caddy-1 --tail 50
