name: Diagnose EC2

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check logs
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker inspect notefusion-prod-api-1 | grep -E "Database__"
            docker inspect notefusion-prod-api-1 | grep "ConnectionString" || true
            cat /opt/notefusion/.env
