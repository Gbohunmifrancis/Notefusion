name: Diagnose EC2

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check logs
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "--- POST /api/auth/register ---"
            curl -v -X POST https://api.notefusion.studio/api/auth/register -H "Content-Type: application/json" -d '{"email":"test@notefusion.studio","fullName":"Test User","password":"Password123@"}'
            echo "\n--- GET /api/app/version ---"
            curl -v https://api.notefusion.studio/api/app/version
