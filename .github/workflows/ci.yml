name: CI

# Runs on the self-hosted runner when the repository variable CI_RUNNER names it (e.g.
# "notefusion-pc", see docs/self-hosted-runner.md); without it, on GitHub's Linux runners, which
# cost half what Windows ones do against the private-repo minute allowance. A pull request from a fork
# always runs on GitHub's runners: the repository is public, and a fork's code must never run on our machine.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "design/**"
      - "web-site/**"
      - "web-admin/**"
      - "mobile/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "design/**"
      - "web-site/**"
      - "web-admin/**"
      - "mobile/**"

# A new push to the same PR or branch replaces the run in progress instead of queuing behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build & tests
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore NoteFusion.slnx

      - name: Build
        run: dotnet build NoteFusion.slnx -c Release --no-restore

      - name: Test
        run: dotnet test NoteFusion.slnx -c Release --no-build --verbosity minimal

  python:
    name: Python transcription API
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # basic-pitch pins tensorflow (no 3.12 wheels); install without deps as in the Dockerfile
          pip install --no-deps basic-pitch==0.4.0

      - name: Type-check
        run: python -m compileall -q app tests

      - name: Test
        run: python -m pytest -q

  clients:
    name: Web, admin & mobile checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The web app's solfa mirror and helpers: plain JS, no install needed.
      - name: Web tests
        run: node --test web-site/tests/*.test.mjs

      - name: Admin console type-check
        working-directory: web-admin
        run: |
          npm ci
          npm run lint

      - name: Mobile type-check and tests
        working-directory: mobile
        run: |
          npm ci
          npm run lint
          npm test
