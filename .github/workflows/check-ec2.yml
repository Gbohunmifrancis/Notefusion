name: Check EC2 Status

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: E2E Tests
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # The server's ECDSA host key (the actions' SSH client checks that one); unset, the key goes unchecked.
          fingerprint: ${{ vars.EC2_HOST_FINGERPRINT }}
          # The YouTube probe fetches on every rung (up to two minutes each), past the action's default ten; the sheet
          # music check reads a page with homr (seconds, five minutes at most).
          command_timeout: 25m
          script: |
            # The repository is public, so this run's log is too: everything below goes through redact (addresses,
            # IPs, push tokens, JWTs and any long token-like string, share links included), and Caddy's access log
            # (every visitor's IP and URL) is never printed.
            redact() { sed -E -e 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[email]/g' \
              -e 's/([0-9]{1,3}\.){3}[0-9]{1,3}/[ip]/g' -e 's/([0-9a-fA-F]{1,4}:){3,7}[0-9a-fA-F]{1,4}/[ip]/g' \
              -e 's/Expo(nent)?PushToken\[[^]]*\]?/[push-token]/g' -e 's/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]*/[jwt]/g' \
              -e 's#(://)[^/@ ]+@#\1***@#g' -e 's/[A-Za-z0-9_-]{32,}/[redacted]/g'; }
            {
            echo "== host"; uptime; nproc; free -m; df -h / | tail -1
            echo "== instance"; TOKEN=$(curl -s -m 2 -X PUT http://169.254.169.254/latest/api/token -H "X-aws-ec2-metadata-token-ttl-seconds: 60"); curl -s -m 2 -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-type; echo
            for k in instance-id placement/region public-ipv4 local-ipv4; do printf "%s: " "$k"; curl -s -m 2 -H "X-aws-ec2-metadata-token: $TOKEN" "http://169.254.169.254/latest/meta-data/$k" | head -c 300; echo; done
            echo "== tools"; command -v aws || echo "no aws cli"; lsblk -o NAME,SIZE,TYPE,MOUNTPOINT | head -8
            echo "== top"; top -bn1 | head -15
            echo "== containers"; docker ps -a
            echo "== stats"; docker stats --no-stream
            for c in $(docker ps --format '{{.Names}}' | grep -v caddy); do echo "== logs $c"; docker logs "$c" --tail 60 2>&1 | grep -v "GET /healthz" | tail -60; done
            echo "== worker: job, link and yt-dlp lines (last 60, with times)"; docker logs -t notefusion-prod-transcriber-1 2>&1 | grep -i -E "yt-dlp|link_attempt|ytdlp_cookies|link job|journal|recover|job [0-9a-f]{8}|vocal engine|accompaniment|transcription_completed|warning|error" | grep -v "GET /healthz" | tail -60 | cut -c1-400
            echo "== yt-dlp cookies (line count only, never the contents)"; docker exec notefusion-prod-transcriber-1 sh -c 'f="${NF_YTDLP_COOKIES_FILE:-unset}"; printf "%s: " "$f"; if [ -s "$f" ]; then printf "%s lines, %s youtube.com rows\n" "$(wc -l < "$f")" "$(grep -c "youtube.com" "$f")"; else echo "missing or empty"; fi' || true
            # What the last few transcriptions came out as: the activity log's own columns, then the
            # stored result of the newest finished jobs (key, tempo, meter, confidence, the first notes
            # as pitch@beat x length, the solfa lines). Metadata only: no audio, no names, no addresses.
            # Push: what Expo and Google answered (ticket and receipt lines, no tokens), and how the admin phones are
            # registered (a token's last characters only, enough to tell two apart).
            echo "== push: the switch as the API sees it (true = Expo, anything else = logged only)"; docker exec notefusion-prod-api-1 printenv Push__UseExpo || echo "(not set)"; grep -E '^Push__UseExpo=' /opt/notefusion/.env || echo "(not in .env)"
            echo "== push: API lines about Expo, receipts and alerts (last 12 h)"; docker logs -t notefusion-prod-api-1 --since 12h 2>&1 | grep -i -E "expo|push|receipt|payment alert|invalidcredentials|devicenotregistered|mismatchsenderid|activity push" | tail -80 | cut -c1-400
            echo "== startup notes: backfills and refunds at the API's last start (last 24 h)"; docker logs -t notefusion-prod-api-1 --since 24h 2>&1 | grep -E "Handed back the charge|hand back the charges|canonical inbox" | tail -10 | cut -c1-300
            cd /opt/notefusion
            echo "== push: admin phones"
            docker compose -f docker-compose.prod.yml exec -T db psql -U notefusion -d notefusion -P pager=off -c "SELECT right(t.\"Token\", 7) AS token_end, t.\"Platform\" AS os, t.\"AppBuild\" AS build, t.\"ServerReminders\" AS srv, t.\"PaymentAlerts\" AS alerts, t.\"PaymentAlertSound\" AS sound, t.\"PaymentAlertQuietAtNight\" AS quiet, to_char(t.\"PaymentAlertsSetAtUtc\",'MM-DD HH24:MI') AS set_at, to_char(t.\"UpdatedAt\",'MM-DD HH24:MI') AS seen, (SELECT count(*) FROM device_tokens o WHERE o.\"Token\" = t.\"Token\" AND o.\"UserId\" <> t.\"UserId\") AS shared FROM device_tokens t JOIN users u ON u.\"Id\" = t.\"UserId\" WHERE u.\"Role\" = 'Admin' ORDER BY t.\"UpdatedAt\" DESC;" || true
            docker compose -f docker-compose.prod.yml exec -T db psql -U notefusion -d notefusion -P pager=off -c "SELECT \"Platform\" AS os, count(*) AS rows, count(DISTINCT \"Token\") AS phones, max(\"AppBuild\") AS newest_build FROM device_tokens GROUP BY 1;" || true
            docker compose -f docker-compose.prod.yml exec -T db psql -U notefusion -d notefusion -P pager=off -c "SELECT to_char(\"CreatedAtUtc\",'MM-DD HH24:MI') AS at, \"Devices\" AS devices, \"Accepted\" AS accepted, \"Refused\" AS refused, \"Attempts\" AS tries, left(\"Error\",120) AS error FROM admin_payment_alerts ORDER BY \"CreatedAtUtc\" DESC LIMIT 5;" || true
            cd /opt/notefusion
            echo "== database logins in use (the API should be notefusion_app, never the superuser: ops/db/app-role.sql)"
            docker compose -f docker-compose.prod.yml exec -T db psql -U notefusion -d notefusion -P pager=off -c "SELECT usename AS login, count(*) AS connections FROM pg_stat_activity WHERE datname = 'notefusion' GROUP BY 1 ORDER BY 1;" || true
            echo "== backups: the latest run of each kind (docs/BACKUP_AND_MIGRATION.md)"
            docker compose -f docker-compose.prod.yml exec -T db psql -U notefusion -d notefusion -P pager=off -c "SELECT DISTINCT ON (\"Kind\") \"Kind\" AS kind, to_char(\"FinishedAtUtc\",'MM-DD HH24:MI') AS at, \"Ok\" AS ok, \"Verified\" AS verified, pg_size_pretty(\"SizeBytes\") AS size, left(\"Detail\",150) AS detail FROM backup_runs ORDER BY \"Kind\", \"FinishedAtUtc\" DESC;" || true
            docker compose -f docker-compose.prod.yml exec -T db psql -U notefusion -d notefusion -P pager=off -c "SELECT archived_count, last_archived_wal, last_archived_time, failed_count FROM pg_stat_archiver;" || true
            echo "== blog: drafting runs and posts (newest first)"
            docker compose -f docker-compose.prod.yml exec -T db psql -U notefusion -d notefusion -P pager=off -c "SELECT to_char(\"CreatedAtUtc\",'MM-DD HH24:MI') AS at, \"Count\" AS n, \"Status\" AS status, \"Model\" AS model, left(\"Error\",160) AS error, jsonb_array_length(items_json::jsonb) AS items FROM blog_generation_runs ORDER BY \"CreatedAtUtc\" DESC LIMIT 6;" || true
            docker compose -f docker-compose.prod.yml exec -T db psql -U notefusion -d notefusion -P pager=off -c "SELECT i->>'slug' AS slug, i->>'passedChecks' AS ok, left(coalesce(i->>'error',''),80) AS error, left(coalesce(i->'problems'->>0,''),120) AS first_problem FROM (SELECT jsonb_array_elements(items_json::jsonb) AS i FROM blog_generation_runs ORDER BY \"CreatedAtUtc\" DESC LIMIT 3) x;" || true
            docker compose -f docker-compose.prod.yml exec -T db psql -U notefusion -d notefusion -P pager=off -c "SELECT \"Slug\" AS slug, \"Status\" AS status, \"Source\" AS source, left(review_notes_json,140) AS notes FROM blog_posts ORDER BY \"CreatedAtUtc\" DESC LIMIT 25;" || true
            echo "== recent transcription logs (newest first)"
            docker compose -f docker-compose.prod.yml exec -T db psql -U notefusion -d notefusion -P pager=off -c "SELECT to_char(\"CreatedAtUtc\",'MM-DD HH24:MI') AS at, \"Client\" AS client, \"Kind\" AS kind, \"Mode\" AS mode, \"Status\" AS status, round(\"AudioSeconds\"::numeric,1) AS secs, \"TimeSignatureRequested\" AS meter_req, \"TempoRequested\" AS tempo_req, \"KeyRequested\" AS key_req, \"DetectedKey\" AS key, \"DetectedTempo\" AS tempo, \"NoteCount\" AS notes, round(\"Confidence\"::numeric,2) AS conf, left(\"FailureReason\",60) AS failure FROM transcription_logs ORDER BY \"CreatedAtUtc\" DESC LIMIT 8;" || true
            echo "== newest finished jobs: what the sheet says"
            docker compose -f docker-compose.prod.yml exec -T db psql -U notefusion -d notefusion -P pager=off -c "SELECT left(\"JobId\",8) AS job, to_char(\"CreatedAtUtc\",'MM-DD HH24:MI') AS at, r->>'key' AS key, r->>'tempo' AS tempo, r->>'timeSignature' AS meter, round((r->>'overallConfidence')::numeric,2) AS conf, round((r->>'keyConfidence')::numeric,2) AS keyconf, r->>'beatOriginSec' AS origin, jsonb_array_length(r->'notes') AS notes, r->>'separated' AS sep, r->>'pitchRefined' AS refined, r->>'songDurationSec' AS song FROM (SELECT \"JobId\",\"CreatedAtUtc\",\"ResultJson\"::jsonb AS r FROM transcription_jobs WHERE \"ResultJson\" IS NOT NULL ORDER BY \"CreatedAtUtc\" DESC LIMIT 4) j;" || true
            echo "== newest finished jobs: the first notes and the solfa lines"
            docker compose -f docker-compose.prod.yml exec -T db psql -U notefusion -d notefusion -P pager=off -x -c "SELECT left(\"JobId\",8) AS job, to_char(\"CreatedAtUtc\",'MM-DD HH24:MI') AS at, r->>'key' AS key, r->>'tempo' AS tempo, (SELECT string_agg((n->>'pitchMidi')||'@'||(n->>'startBeat')||'x'||(n->>'durBeats'), ' ' ORDER BY i) FROM jsonb_array_elements(r->'notes') WITH ORDINALITY AS t(n,i) WHERE i <= 90) AS first_notes, left((SELECT string_agg(x, ' | ') FROM jsonb_array_elements_text(r->'solfaLines') x), 700) AS solfa FROM (SELECT \"JobId\",\"CreatedAtUtc\",\"ResultJson\"::jsonb AS r FROM transcription_jobs WHERE \"ResultJson\" IS NOT NULL ORDER BY \"CreatedAtUtc\" DESC LIMIT 4) j ORDER BY \"CreatedAtUtc\" DESC;" || true
            echo "== cookies file"; ls -la /opt/notefusion/ytdlp-cookies.txt 2>/dev/null || echo "no cookies file"
            # Whether the worker still reads printed music (app/pipeline/sheet_check.py): a known engraved page through
            # homr and the score path a photo takes, against the hymn's own notes. Before the link probes, which can
            # take the rest of the time.
            echo "== sheet music check"
            cd /opt/notefusion
            timeout 300 docker compose -f docker-compose.prod.yml exec -T transcriber python -m app.pipeline.sheet_check || echo "(sheet music check failed or did not finish)"
            # What YouTube answers the worker right now: the worker's own probe (app/ingest/probe.py) shows the ladder as
            # configured (rungs, whether a proxy and the token sidecar are set and answer, cookie rows, yt-dlp), then has
            # each rung fetch ten seconds of two videos with the cookies, tokens and proxy the jobs use. A download, not
            # only the details: YouTube can answer the details and refuse the audio.
            echo "== youtube probe from inside the worker"
            cd /opt/notefusion
            timeout 600 docker compose -f docker-compose.prod.yml exec -T transcriber python -m app.ingest.probe || echo "(probe did not finish)"
            # The controlled link test matrix (app/ingest/link_matrix.json): one public link per shape a person pastes,
            # through the worker's parse, resolve and a ten-second fetch, and whether each ended as expected.
            echo "== link test matrix"
            timeout 600 docker compose -f docker-compose.prod.yml exec -T transcriber python -m app.ingest.probe --links || echo "(some cases ended otherwise, or the matrix did not finish)"
            } 2>&1 | redact
