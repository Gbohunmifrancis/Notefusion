name: Check EC2 Status

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: E2E Tests
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "== host"; uptime; nproc; free -m; df -h / | tail -1
            echo "== instance"; TOKEN=$(curl -s -m 2 -X PUT http://169.254.169.254/latest/api/token -H "X-aws-ec2-metadata-token-ttl-seconds: 60"); curl -s -m 2 -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-type; echo
            for k in instance-id placement/region public-ipv4 local-ipv4 iam/info; do printf "%s: " "$k"; curl -s -m 2 -H "X-aws-ec2-metadata-token: $TOKEN" "http://169.254.169.254/latest/meta-data/$k" | head -c 300; echo; done
            echo "== tools"; command -v aws || echo "no aws cli"; lsblk -o NAME,SIZE,TYPE,MOUNTPOINT | head -8
            echo "== top"; top -bn1 | head -15
            echo "== containers"; docker ps -a
            echo "== stats"; docker stats --no-stream
            for c in $(docker ps --format '{{.Names}}'); do echo "== logs $c"; docker logs "$c" --tail 60 2>&1 | grep -v "GET /healthz" | tail -60; done
            echo "== worker: link and yt-dlp lines (last 40)"; docker logs notefusion-prod-transcriber-1 2>&1 | grep -i -E "yt-dlp|link job|journal|recover" | tail -40
            echo "== cookies file"; ls -la /opt/notefusion/ytdlp-cookies.txt 2>/dev/null || echo "no cookies file"
            # What YouTube answers the worker right now, with the proof-of-origin tokens it runs with:
            # the default player clients, then the tv_embedded fallback, then the cookies if there are any.
            echo "== youtube probe from inside the worker"
            cd /opt/notefusion
            probe() { timeout 90 docker compose -f docker-compose.prod.yml exec -T transcriber sh -c "yt-dlp --no-warnings --no-playlist -q --extractor-args 'youtubepot-bgutilhttp:base_url=http://bgutil-provider:4416' $1 -f 'bestaudio[ext=m4a]/bestaudio/best' --print '%(format_id)s %(protocol)s %(duration)s' https://www.youtube.com/watch?v=dQw4w9WgXcQ 2>&1 | tail -2"; }
            docker compose -f docker-compose.prod.yml exec -T transcriber sh -c "cp /run/ytdlp-cookies.txt /tmp/probe-cookies.txt 2>/dev/null || true"
            echo "-- default clients"; probe ""
            echo "-- tv_embedded"; probe "--extractor-args youtube:player_client=tv_embedded"
            if [ -s /opt/notefusion/ytdlp-cookies.txt ]; then echo "-- default clients + cookies"; probe "--cookies /tmp/probe-cookies.txt" ; fi
