name: Deploy admin console to Cloudflare

# The admin console (web-admin/, admin.notefusion.studio) is a Next.js app built as static files
# (`output: "export"`) and served by Cloudflare as Workers static assets (web-admin/wrangler.jsonc). It
# moved from Vercel on 29 Oct 2026, when the Hobby plan paused the account. This builds and deploys it
# on every merge that touches web-admin/.
#
# Uses the website's CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see deploy-web.yml). The API's
# address is web-admin/.env.production (NEXT_PUBLIC_API_URL), read by the build. The pages with an id in
# the path are one page each, served for every id by out/_redirects (scripts/cloudflare-redirects.mjs).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web-admin/**"
      - ".github/workflows/deploy-admin.yml"

concurrency:
  group: deploy-admin
  cancel-in-progress: false

jobs:
  # Nothing is deployed while the code holds a secret (secret-scan.yml).
  secret-scan:
    uses: ./.github/workflows/secret-scan.yml

  cloudflare:
    name: Cloudflare production deploy
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web-admin
    env:
      ADMIN_URL: ${{ vars.ADMIN_URL || 'https://admin.notefusion.studio' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check secrets
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in the repository secrets (see .github/workflows/deploy-web.yml)."
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-admin/package-lock.json

      - name: Install
        run: npm ci

      - name: Build the static console
        run: npm run build:cloudflare

      # The CLI is pinned, as deploy-web.yml's is.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npx --yes wrangler@4.151.3 deploy

      - name: Smoke-check the console
        run: |
          sleep 10
          for path in /login /blog /blog-analytics /users/00000000-0000-0000-0000-000000000000; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "${ADMIN_URL}${path}")
            echo "${code}  ${path}"
            case "$code" in 200|307|308) ;; *) echo "::error::${path} returned ${code}"; exit 1;; esac
          done
