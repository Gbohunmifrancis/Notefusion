name: Deploy website to Vercel

# The marketing site and web app (web-site/) are static files on Vercel. They used to ship by
# hand with `cd web-site && vercel --prod` from a working tree, which is how the live site fell
# behind main. This deploys the committed folder on every merge that touches it.
#
# Needs three repository secrets, all from the Vercel dashboard / `vercel link` in web-site/:
#   VERCEL_TOKEN       an account token (Settings → Tokens)
#   VERCEL_ORG_ID      .vercel/project.json → orgId      (team_0ghJL5LGBgeSs8b2UEYo3ynj)
#   VERCEL_PROJECT_ID  .vercel/project.json → projectId  (prj_LkfxRv0q0HiDtj8KlE2v5zTBsd4W, the "notefusion" project)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web-site/**"
      - ".github/workflows/deploy-web.yml"

concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  vercel:
    name: Vercel production deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-site
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Set VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID in the repository secrets (see .github/workflows/deploy-web.yml)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Deployed from a copy of the folder outside the checkout. Vercel reads the git
      # metadata it finds next to the files and attributes the deployment to that
      # commit's author; when the author is not a member of the Vercel team (a bot, a
      # contributor) the deployment is created and then BLOCKED ("the commit author
      # doesn't have permission to create deployments for this project"). Outside the
      # checkout there is no git metadata, so the deployment is attributed to the token.
      - name: Stage the site outside the git checkout
        run: |
          rm -rf "$RUNNER_TEMP/site" && mkdir -p "$RUNNER_TEMP/site"
          cp -R . "$RUNNER_TEMP/site/"

      - name: Pull the project's Vercel settings
        working-directory: ${{ runner.temp }}/site
        run: npx --yes vercel@latest pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy
        working-directory: ${{ runner.temp }}/site
        run: npx --yes vercel@latest deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Smoke-check the live site
        working-directory: .
        run: |
          sleep 10
          for path in / /app /app/sheet /assets/app.js /assets/choir.js /assets/preview.js /blog /hymns /sitemap.xml; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "https://notefusion.studio${path}")
            echo "${code}  ${path}"
            case "$code" in 200|308) ;; *) echo "::error::${path} returned ${code}"; exit 1;; esac
          done

      # Search engines that take part in IndexNow (Bing and others; not Google) are told which blog
      # and hymn pages this push added, changed or removed. Best effort: it never fails the deploy.
      # The key file it relies on, web-site/<key>.txt, is written by tools/blog/build.mjs.
      - name: Ping IndexNow with the changed blog and hymn pages
        if: github.event_name == 'push'
        working-directory: .
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          git fetch --no-tags --depth=1 origin "$BEFORE" || echo "Could not fetch $BEFORE"
          node tools/blog/indexnow.mjs "$BEFORE" "$GITHUB_SHA"
