name: Deploy website to Vercel

# The marketing site and web app (web-site/) are static files on Vercel. They used to ship by
# hand with `cd web-site && vercel --prod` from a working tree, which is how the live site fell
# behind main. This deploys the committed folder on every merge that touches it.
#
# The blog's posts are not committed: they live in the API's database and are published from the
# admin console. Before deploying, `tools/blog/build.mjs --api` reads every live post from
# GET /api/blog/published and renders the blog, the hymn pages that cite posts, the sitemap, the
# feed and the home page's latest-posts strip into the staged copy. If the API cannot be read (after
# waiting up to 15 minutes for an API deploy that is racing this one), the deploy FAILS and the live
# site stays as it was — a site without its blog is never published. See docs/BLOG.md.
#
# The API runs this workflow itself (workflow_dispatch on main) when a post is published, unpublished,
# edited while live, or goes live on its schedule; GitHub keeps one run going and one waiting, so a
# burst of publishes is one or two deploys.
#
# Needs three repository secrets, all from the Vercel dashboard / `vercel link` in web-site/:
#   VERCEL_TOKEN       an account token (Settings → Tokens)
#   VERCEL_ORG_ID      .vercel/project.json → orgId      (team_0ghJL5LGBgeSs8b2UEYo3ynj)
#   VERCEL_PROJECT_ID  .vercel/project.json → projectId  (prj_LkfxRv0q0HiDtj8KlE2v5zTBsd4W, the "notefusion" project)
# Optional repository variable BLOG_API_URL (default https://api.notefusion.studio).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web-site/**"
      - "content/**"
      - "tools/blog/**"
      - ".github/workflows/deploy-web.yml"

concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  vercel:
    name: Vercel production deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web-site
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      BLOG_API_URL: ${{ vars.BLOG_API_URL || 'https://api.notefusion.studio' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Set VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID in the repository secrets (see .github/workflows/deploy-web.yml)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/blog/package-lock.json

      - name: Install the blog generator
        working-directory: tools/blog
        run: npm ci

      # Kept to tell IndexNow afterwards which blog and hymn pages are new, changed or gone.
      - name: Save the live sitemap
        working-directory: .
        run: curl -fsS --max-time 20 https://notefusion.studio/sitemap.xml -o "$RUNNER_TEMP/live-sitemap.xml" || echo "No live sitemap; IndexNow will be told about every page."

      # The live posts from the API into web-site/ (blog, hymn pages and their PDFs, sitemap, feed, home-page strip,
      # /blog/catalogue.json). Fails the deploy when the API cannot be read.
      - name: Build the blog from the API
        working-directory: .
        run: node tools/blog/build.mjs --api "$BLOG_API_URL" --api-wait 900

      - name: Check the built pages (warnings only)
        working-directory: .
        run: node tools/blog/check.mjs --deployed

      # Deployed from a copy of the folder outside the checkout. Vercel reads the git
      # metadata it finds next to the files and attributes the deployment to that
      # commit's author; when the author is not a member of the Vercel team (a bot, a
      # contributor) the deployment is created and then BLOCKED ("the commit author
      # doesn't have permission to create deployments for this project"). Outside the
      # checkout there is no git metadata, so the deployment is attributed to the token.
      # /app's error reports (assets/errors.js): the web Sentry project's DSN and this commit go into the staged copy
      # only (docs/DEPLOYMENT.md, "Error reports"). Without SENTRY_DSN_WEB the slots stay empty and nothing is sent.
      - name: Stage the site outside the git checkout
        env:
          SENTRY_DSN_WEB: ${{ vars.SENTRY_DSN_WEB || secrets.SENTRY_DSN_WEB }}
        run: |
          rm -rf "$RUNNER_TEMP/site" && mkdir -p "$RUNNER_TEMP/site"
          cp -R . "$RUNNER_TEMP/site/"
          if [ -n "$SENTRY_DSN_WEB" ]; then
            case "$SENTRY_DSN_WEB" in
              https://*@*.sentry.io/*) ;;
              *) echo "::error::SENTRY_DSN_WEB is not a Sentry DSN (https://<key>@<host>.sentry.io/<project>)."; exit 1 ;;
            esac
            page="$RUNNER_TEMP/site/app/index.html"
            sed -i -e "s|<meta name=\"nf-sentry-dsn\" content=\"\">|<meta name=\"nf-sentry-dsn\" content=\"$SENTRY_DSN_WEB\">|" \
                   -e "s|<meta name=\"nf-release\" content=\"\">|<meta name=\"nf-release\" content=\"$GITHUB_SHA\">|" "$page"
            grep -q '<meta name="nf-sentry-dsn" content="https://' "$page" || { echo "::error::The Sentry DSN did not reach app/index.html."; exit 1; }
          fi

      # The CLI is pinned (it runs with the account-wide VERCEL_TOKEN): a new release reaches the deploy only when
      # this version is bumped on purpose, never because it was published. deploy-admin.yml pins the same one.
      - name: Pull the project's Vercel settings
        working-directory: ${{ runner.temp }}/site
        run: npx --yes vercel@64.5.0 pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy
        working-directory: ${{ runner.temp }}/site
        run: npx --yes vercel@64.5.0 deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Smoke-check the live site
        working-directory: .
        run: |
          sleep 10
          for path in / /app /app/sheet /assets/app.js /assets/choir.js /assets/preview.js /blog /blog/feed.xml /blog/catalogue.json /hymns /hymns/occasions /hymns/people /hymns/first-lines /hymns/amazing-grace/amazing-grace-tonic-solfa.pdf /sitemap.xml; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "https://notefusion.studio${path}")
            echo "${code}  ${path}"
            case "$code" in 200|308) ;; *) echo "::error::${path} returned ${code}"; exit 1;; esac
          done

      # Search engines that take part in IndexNow (Bing and others; not Google) are told which blog
      # and hymn pages this deploy added, changed or removed: from the sitemaps (posts published in the
      # console) and, on a push, from the commits. Best effort: it never fails the deploy. The key
      # file it relies on, web-site/<key>.txt, is written by tools/blog/build.mjs.
      - name: Ping IndexNow with the changed blog and hymn pages
        working-directory: .
        env:
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          if [ -n "$BEFORE" ]; then git fetch --no-tags --depth=1 origin "$BEFORE" || echo "Could not fetch $BEFORE"; fi
          node tools/blog/indexnow.mjs --sitemaps "$RUNNER_TEMP/live-sitemap.xml" web-site/sitemap.xml $BEFORE ${BEFORE:+$GITHUB_SHA}
