plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.notefusionlisten'
version = '1.0.0'

android {
  namespace "expo.modules.notefusionlisten"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // The headless task that hands a take to JS (ListenTakeHeadlessService). Versioned by React Native's own
  // Gradle plugin, as expo's module takes it.
  implementation 'com.facebook.react:react-android'
}
