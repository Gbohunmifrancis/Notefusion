<!-- NoteFusion glyph "float": the floating button over other apps (Settings › Listen from anywhere). A phone with a
     round button on its edge, half off it, as the button sits on the screen. Drawn on the 24 grid (e-icons board 09):
     1.75 stroke, round caps and joins, the button solid (fill="currentColor"). mobile/scripts/build-icons.mjs reads
     this file. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <rect x="4.5" y="2.5" width="11" height="19" rx="2.5"/>
  <path d="M8.5 18h3"/>
  <circle cx="16" cy="10.5" r="3.4" fill="currentColor" stroke="none"/>
</svg>
