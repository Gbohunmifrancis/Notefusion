<!-- NoteFusion glyph "interval": Intervals, jump to the note. Drawn on the 24 grid (e-icons board 09): 1.75 stroke, round
     caps and joins, solid note heads (fill="currentColor"). <g id="wash">, when present, is the 20% wash drawn under
     the selected state (the active tab); it is hidden here. mobile/scripts/build-icons.mjs reads this file. -->
