[pytest]
# The accuracy harness runs real Basic Pitch inference per case, so it must never be
# part of CI's default run (`python -m pytest -q`, working-directory server).
markers =
    accuracy: scores the synthetic corpus with real Basic Pitch inference (slow; excluded from the default run)

# Excluded by default. A command-line -m is appended after addopts and argparse keeps
# the last value, so the harness is still runnable deliberately:
#     python -m pytest -q tests/accuracy -m accuracy
addopts = -m "not accuracy"
