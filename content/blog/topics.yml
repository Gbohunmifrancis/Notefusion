# Blog topics, highest priority first. Twice a week the blog-draft workflow takes the first topic
# that has no post (content/blog/<slug>.md) and no open draft branch (blog/<slug>), drafts it with
# the Gemini API and opens a pull request. See docs/BLOG.md.
#
#   slug     the post's URL: /blog/<slug> (never change it once the post is published)
#   keyword  the search phrase the post is written to answer
#   intent   what the searcher wants
#   angle    what makes our post worth reading over the others
#   links    site paths the post must link to (pages that exist; /app is always required)
#   skip     true to leave a topic in the list without drafting it
#
# No search-volume numbers here on purpose: check them in Search Console once the blog has data.

