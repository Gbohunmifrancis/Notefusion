name: notefusion-prod

# Container logs are json files on the host disk and grow without bound by default.
# On an 8 GB EC2 root volume that is what fills the disk and breaks the next image
# pull ("no space left on device"), so every service rotates its log.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    # Pinned (PostgreSQL 16.15, Alpine 3.24): the backup image is built on this same image, so pg_dump and
    # the point-in-time restore run the very binaries the database does, and the two share their layers.
    # Bump both together (ops/backup/Dockerfile, PG_IMAGE). Stay on Alpine: the data directory's text
    # indexes are sorted by musl, and a glibc image would read them wrongly.
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: always
    logging: *default-logging
    # Continuous archiving for point-in-time recovery (docs/BACKUP_AND_MIGRATION.md). The database only
    # gzips each finished WAL segment into the wal-spool volume, at least once a minute (archive_timeout);
    # the backup service ships them to the bucket. It never fails the archive and never lets WAL pile up:
    # with the spool unwritable (the backup service not started yet) or over NF_WAL_SPOOL_MAX_MB (the
    # bucket unreachable for a long time), the segment is let go and a marker says so, which the backup
    # service reports. Changing these flags restarts the database once (a few seconds).
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=60
      - -c
      - >-
        archive_command=d=/var/lib/postgresql/wal-spool;
        if [ ! -w "$$d" ]; then echo "nf-archive: $$d not writable, %f not kept" >&2;
        elif [ "$$(du -sm "$$d" | cut -f1)" -ge "$${NF_WAL_SPOOL_MAX_MB:-1024}" ]; then : > "$$d/dropped-%f"; echo "nf-archive: spool full, %f dropped" >&2;
        else gzip -1 -c %p > "$$d/%f.gz.tmp" && mv "$$d/%f.gz.tmp" "$$d/%f.gz"; fi
    environment:
      POSTGRES_DB: notefusion
      POSTGRES_USER: notefusion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      NF_WAL_SPOOL_MAX_MB: ${NF_WAL_SPOOL_MAX_MB:-1024}
    volumes:
      - db-data:/var/lib/postgresql/data
      - wal-spool:/var/lib/postgresql/wal-spool
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notefusion -d notefusion"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  transcriber:
    image: ${TRANSCRIBER_IMAGE:-ghcr.io/OWNER/notefusion-transcriber:latest}
    restart: always
    logging: *default-logging
    environment:
      NF_MAX_CLIP_SECONDS: ${NF_MAX_CLIP_SECONDS:-180}
      NF_MAX_UPLOAD_BYTES: ${NF_MAX_UPLOAD_BYTES:-26214400}
      NF_JOB_TTL_SECONDS: ${NF_JOB_TTL_SECONDS:-900}
      NF_API_KEY: ${TRANSCRIPTION_API_KEY}
      # YouTube refuses anonymous downloads from datacenter addresses ("Sign in to confirm
      # you're not a bot"), which is every EC2 instance. A cookies file exported from a
      # signed-in browser gets through; the deploy writes it from the YTDLP_COOKIES secret
      # and mounts it here. With no secret, /dev/null is mounted and yt-dlp runs without.
      NF_YTDLP_COOKIES_FILE: /run/ytdlp-cookies.txt
      # YouTube's proof-of-origin tokens come from the bgutil-provider sidecar below. Set apart
      # from NF_YTDLP_EXTRA_ARGS, so extra flags in .env can no longer drop the tokens.
      NF_YTDLP_POT_URL: http://bgutil-provider:4416
      # Crashes to Sentry (docs/DEPLOYMENT.md, "Error reports"): off while the DSN is blank.
      NF_SENTRY_DSN: ${NF_SENTRY_DSN:-}
      NF_SENTRY_RELEASE: ${NF_SENTRY_RELEASE:-}
      NF_YTDLP_EXTRA_ARGS: ${NF_YTDLP_EXTRA_ARGS:-}
      # The player clients a refused extraction is tried again with (app/config.py). Empty
      # in .env switches the second try off; unset keeps the default.
      NF_YTDLP_FALLBACK_CLIENTS: ${NF_YTDLP_FALLBACK_CLIENTS-mweb,android_vr,web_embedded}
      # Optional and off: a residential proxy for YouTube alone, tried only after YouTube refused
      # this server directly and with the fallback clients. The deploy writes it from the
      # YTDLP_PROXY secret (docs/DEPLOYMENT.md, "A residential proxy (optional, a later step)").
      NF_YTDLP_PROXY: ${NF_YTDLP_PROXY:-}
      # The worker installs the newest yt-dlp at startup and daily (app/ingest/ytdlp_update.py);
      # "stable" instead of the nightly channel if a nightly ever misbehaves.
      NF_YTDLP_UPDATE_CHANNEL: ${NF_YTDLP_UPDATE_CHANNEL:-nightly}
      # Vocal separation is the memory peak (about 1.4 GB per song at the defaults; see
      # app/pipeline/separate.py). The limit keeps a runaway worker from taking the API and
      # the database down with it: the kernel kills this container alone and Docker restarts it.
      NF_MDX_BATCH: ${NF_MDX_BATCH:-1}
      NF_MDX_MEM_ARENA: ${NF_MDX_MEM_ARENA:-0}
      # The job journal (app/jobs/journal.py): every submitted job, with an upload's audio, on
      # the job-data volume, replayed after a restart under the same job id. Without it a
      # deploy or an out-of-memory kill dropped every queued and running job.
      NF_JOB_DIR: /var/lib/notefusion/jobs
      # A linked video longer than this is refused when the link is pasted (default two hours).
      NF_LINK_MAX_VIDEO_SECONDS: ${NF_LINK_MAX_VIDEO_SECONDS:-7200}
    mem_limit: ${NF_TRANSCRIBER_MEM_LIMIT:-3g}
    # A real PID 1 reaps the yt-dlp, ffmpeg and separation children a timeout kills. /tmp is
    # deliberately not a tmpfs: a linked song's working files reach ~250 MB per job (the
    # download, 44.1 kHz stereo WAVs of up to six minutes, the stems), tmpfs pages count
    # against mem_limit, and separation already peaks near 1.6 GB of it. The worker sweeps
    # its own leftovers from /tmp at startup instead (app.main._sweep_stale_temp_files).
    init: true
    volumes:
      - ${YTDLP_COOKIES_HOST:-/dev/null}:/run/ytdlp-cookies.txt:ro
      - job-data:/var/lib/notefusion
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Mints the proof-of-origin tokens YouTube asks datacenter addresses for (bgutil, GPL-3.0;
  # the yt-dlp plugin in the transcriber image is pinned to the same version). Reached only
  # by the transcriber on the compose network: no published port. It holds no state, so a
  # restart costs nothing; the V8 heap cap keeps it well inside its limit on the small box
  # (the Check EC2 Status workflow's "docker stats" shows what it uses).
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.2-deno
    restart: always
    init: true
    logging: *default-logging
    environment:
      DENO_V8_FLAGS: --max-old-space-size=${NF_BGUTIL_HEAP_MB:-160}
    mem_limit: ${NF_BGUTIL_MEM_LIMIT:-320m}

  api:
    image: ${API_IMAGE:-ghcr.io/OWNER/notefusion-api:latest}
    restart: always
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
      transcriber:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080" # Bound to localhost only. External traffic goes through Caddy.
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Database__Host: db
      Database__Port: "5432"
      Database__Database: notefusion
      Database__Username: notefusion
      Database__Password: ${POSTGRES_PASSWORD}
      Database__ApplyMigrationsAtStartup: "true"
      TranscriptionApi__BaseUrl: http://transcriber:8000
      TranscriptionApi__ApiKey: ${TRANSCRIPTION_API_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__PrivateKeyPem: /run/secrets/jwt_private_key.pem
      Seed__AdminFullName: NoteFusion Admin
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL:-admin@notefusion.app}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD}
      # Push goes out through Expo in production; set the PUSH__USEEXPO secret to false to only log it.
      Push__UseExpo: ${Push__UseExpo:-true}
      # Web push for the web app (notifications with the tab closed). All optional: without a key pair the
      # VAPID keys are derived from the JWT signing key (stable across deploys); false turns it off.
      WebPush__Enabled: ${WebPush__Enabled:-true}
      WebPush__PublicKey: ${WebPush__PublicKey:-}
      WebPush__PrivateKey: ${WebPush__PrivateKey:-}
      WebPush__Subject: ${WebPush__Subject:-mailto:hello@notefusion.studio}
      Security__RequireHttps: "false"
      Swagger__Enabled: "false"
      RateLimit__TrustedProxyHops: "1" 
      Cors__AllowedOrigins__0: ${ADMIN_DASHBOARD_ORIGIN:-https://admin.notefusion.studio}
      # The public site's signed-in web app (web-site/app) calls the API from the browser.
      Cors__AllowedOrigins__1: ${WEBSITE_ORIGIN:-https://notefusion.studio}
      Cors__AllowedOrigins__2: ${WEBSITE_WWW_ORIGIN:-https://www.notefusion.studio}
      # Admin-console passkeys (WebAuthn): the relying party and the pages allowed to use it. The console's
      # host must be the RP id or under it. Blank = these defaults.
      Passkeys__RpId: ${Passkeys__RpId:-notefusion.studio}
      Passkeys__Origins: ${Passkeys__Origins:-https://admin.notefusion.studio}
      Email__ApiKey: ${Email__ApiKey}
      Resend__From: ${Resend__From}
      Email__FromAddress: ${Email__FromAddress}
      Email__AssetBaseUrl: ${Email__AssetBaseUrl}
      Email__UseResend: ${Email__UseResend}
      # The email plan's caps (defaults: Resend's free 100 a day and 3,000 a month, no weekly cap); optional mail
      # stops at Email__OptionalShare (0.6) of each so essential mail keeps room. Blank = default, 0 = no cap.
      Email__DailyLimit: ${Email__DailyLimit}
      Email__WeeklyLimit: ${Email__WeeklyLimit}
      Email__MonthlyLimit: ${Email__MonthlyLimit}
      Email__OptionalShare: ${Email__OptionalShare}
      Google__ClientId: ${Google__ClientId}
      # Billing model: naira plans are Paystack subscriptions, dollar plans are Bachs subscriptions.
      # Currency routes the charge — Paystack lists NGN, Bachs lists USD — and the default provider only
      # breaks a tie. A provider without its base URL boots as a stub, so the URLs default here.
      Billing__DefaultProvider: ${Billing__DefaultProvider:-Bachs}
      Billing__CheckoutCallbackUrl: ${Billing__CheckoutCallbackUrl}
      Bachs__BaseUrl: ${Bachs__BaseUrl:-https://api.bachs.io}
      Bachs__SecretKey: ${Bachs__SecretKey}
      Bachs__WebhookSecret: ${Bachs__WebhookSecret}
      Bachs__SupportedCurrencies: ${Bachs__SupportedCurrencies:-USD}
      # Bachs subscriptions are catalog products: one per USD plan code (monthly and yearly differ in
      # billing_cycle, which is immutable per product). The bare codes are honoured as a fallback.
      Bachs__ProductMap__pro_monthly_usd: ${Bachs__ProductMap__pro_monthly_usd:-}
      Bachs__ProductMap__pro_yearly_usd: ${Bachs__ProductMap__pro_yearly_usd:-}
      Bachs__ProductMap__pro_monthly: ${Bachs__ProductMap__pro_monthly:-}
      Bachs__ProductMap__pro_yearly: ${Bachs__ProductMap__pro_yearly:-}
      Paystack__BaseUrl: ${Paystack__BaseUrl:-https://api.paystack.co}
      Paystack__SecretKey: ${Paystack__SecretKey}
      Paystack__WebhookSecret: ${Paystack__WebhookSecret:-}
      Paystack__SupportedCurrencies: ${Paystack__SupportedCurrencies:-NGN}
      # Flutterwave takes dollars only once it is the default provider (Billing__DefaultProvider=Flutterwave);
      # until then, live or not, Bachs keeps them. Live only with all three of key, base URL and secret hash.
      Flutterwave__BaseUrl: ${Flutterwave__BaseUrl:-https://api.flutterwave.com}
      Flutterwave__SecretKey: ${Flutterwave__SecretKey:-}
      Flutterwave__WebhookSecret: ${Flutterwave__WebhookSecret:-}
      Flutterwave__SupportedCurrencies: ${Flutterwave__SupportedCurrencies:-USD}
      # Profile photos (Cloudflare R2). The deploy writes these into .env; without them here the API
      # never sees them and photo uploads stay off. UseR2 must default: an empty bool stops startup.
      R2__UseR2: ${R2__UseR2:-false}
      R2__AccountId: ${R2__AccountId}
      R2__AccessKeyId: ${R2__AccessKeyId}
      R2__SecretAccessKey: ${R2__SecretAccessKey}
      R2__BucketName: ${R2__BucketName}
      R2__PublicBaseUrl: ${R2__PublicBaseUrl}
      # The founder's customer-research emails and pushes (docs/DEPLOYMENT.md, "Outreach"). On in production
      # by default; the code default is off, so dev and tests send nothing. A blank value takes the default.
      Outreach__Enabled: ${Outreach__Enabled:-true}
      Outreach__FounderName: ${Outreach__FounderName:-Francis}
      Outreach__ReplyTo: ${Outreach__ReplyTo:-hello@notefusion.studio}
      Outreach__BatchSize: ${Outreach__BatchSize:-5}
      Outreach__IntervalMinutes: ${Outreach__IntervalMinutes:-60}
      # The blog (docs/BLOG.md). Gemini drafts posts from the admin console and twice a week (Mon and Thu
      # 05:30 UTC); drafts never publish themselves. Publishing runs deploy-web.yml through GitHub's API with
      # GitHub__Token. Without the key or the token that part is off and the console says so. Blank = default.
      Gemini__ApiKey: ${Gemini__ApiKey:-}
      Gemini__Model: ${Gemini__Model:-}
      Gemini__FallbackModels: ${Gemini__FallbackModels:-}
      GitHub__Token: ${GitHub__Token:-}
      GitHub__Repo: ${GitHub__Repo:-Gbohunmifrancis/Notefusion}
      Blog__SiteUrl: ${Blog__SiteUrl:-https://notefusion.studio}
      Blog__AutoDraftEnabled: ${Blog__AutoDraftEnabled:-}
      Blog__AutoPublishDrafts: ${Blog__AutoPublishDrafts:-}
      Blog__AutoDraftDays: ${Blog__AutoDraftDays:-}
      Blog__AutoDraftTimeUtc: ${Blog__AutoDraftTimeUtc:-}
      Blog__AutoDraftCount: ${Blog__AutoDraftCount:-}
      # A planned move (docs/BACKUP_AND_MIGRATION.md): true answers every write with a 503. The deploy wrote it to
      # .env from MAINTENANCE_READ_ONLY all along, but nothing here passed it in, so the switch did nothing.
      Maintenance__ReadOnly: ${Maintenance__ReadOnly:-false}
      # Errors to Sentry (docs/DEPLOYMENT.md, "Error reports"): off while the DSN is blank. The release is the commit.
      Sentry__Dsn: ${Sentry__Dsn:-}
      Sentry__Release: ${Sentry__Release:-}
    volumes:
      - ./jwt_private_key.pem:/run/secrets/jwt_private_key.pem:ro

  # Backups (docs/BACKUP_AND_MIGRATION.md, ops/backup): a logical dump every 6 hours, a daily base backup
  # plus WAL every minute for point-in-time recovery, and the photos, JWT key and Caddyfile daily — all
  # encrypted client-side into the backup bucket (Cloudflare R2, or any S3-compatible store). Runs at the
  # lowest CPU and I/O priority. Without every BACKUP_* setting it logs which are missing and idles; it never
  # crash-loops and never holds up a deploy. Its database login (notefusion_backup, ops/backup/db-role.sql)
  # can read everything and add backup_runs rows, nothing more; the deploy derives its password.
  backup:
    image: ${BACKUP_IMAGE:-ghcr.io/OWNER/notefusion-backup:latest}
    restart: always
    init: true
    logging: *default-logging
    depends_on:
      - db
    environment:
      PGHOST: db
      PGDATABASE: notefusion
      PGUSER: notefusion_backup
      PGPASSWORD: ${BACKUP_DB_PASSWORD:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-auto}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_ENCRYPTION_PASSWORD: ${BACKUP_ENCRYPTION_PASSWORD:-}
      # Optional second destination at another provider (an rclone connection string); off when empty.
      BACKUP_MIRROR: ${BACKUP_MIRROR:-}
      # Where WAL-G keeps base backups and WAL; a database restored from a logical dump is a new cluster and
      # needs a fresh prefix (docs/BACKUP_AND_MIGRATION.md). Empty = s3://<bucket>/wal-g.
      WALG_S3_PREFIX: ${BACKUP_WALG_PREFIX:-}
      # "off" on a managed database, whose provider does point-in-time recovery itself.
      BACKUP_PHYSICAL: ${BACKUP_PHYSICAL:-on}
      # The profile-photo bucket, read with the API's own photo credentials (never the backup token).
      # FILES_S3_ENDPOINT overrides the R2 address if the photos ever move to another S3-compatible store.
      FILES_S3_ENDPOINT: ${FILES_S3_ENDPOINT:-https://${R2__AccountId:-}.r2.cloudflarestorage.com}
      FILES_S3_BUCKET: ${R2__BucketName:-}
      FILES_S3_ACCESS_KEY_ID: ${R2__AccessKeyId:-}
      FILES_S3_SECRET_ACCESS_KEY: ${R2__SecretAccessKey:-}
    volumes:
      - db-data:/var/lib/postgresql/data:ro
      - wal-spool:/var/lib/postgresql/wal-spool
      - backup-work:/work
      - ./jwt_private_key.pem:/run/host/jwt_private_key.pem:ro
      - ./Caddyfile:/run/host/Caddyfile:ro
      - ${BACKUP_ENV_NAMES_HOST:-/dev/null}:/run/host/env-names.txt:ro
    # A soft share: full speed when the box is idle, last in line when a transcription wants the CPU.
    cpu_shares: 128
    mem_limit: ${NF_BACKUP_MEM_LIMIT:-768m}

  # Container logs at /logs (Caddy proxies it). Pinned: an image with the Docker socket must
  # not change under a restart. The socket mount is :ro, but that only stops the socket file
  # being replaced: Docker still answers every API call over it, so whoever reaches Dozzle
  # reaches what it can do with the socket. Hence the sign-in below.
  # Sign-in: the deploy sets DOZZLE_AUTH_PROVIDER=simple and writes the users file when the
  # DOZZLE_USER / DOZZLE_PASSWORD_HASH secrets are set (docs/DEPLOYMENT.md, "Logs").
  dozzle:
    image: amir20/dozzle:v11.3.2
    restart: always
    logging: *default-logging
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dozzle-data:/data
      - ${DOZZLE_USERS_HOST:-/dev/null}:/data/users.yml:ro
    environment:
      DOZZLE_BASE: /logs
      DOZZLE_AUTH_PROVIDER: ${DOZZLE_AUTH_PROVIDER:-none}

  caddy:
    image: caddy:2-alpine
    restart: always
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
      - dozzle
    volumes:
      - caddy-data:/data
      - ./Caddyfile:/etc/caddy/Caddyfile

volumes:
  db-data:
  caddy-data:
  dozzle-data:
  job-data:
  wal-spool:
  backup-work:
